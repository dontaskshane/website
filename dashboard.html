<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦠</text></svg>">
    <style>
        :root {
            --bg: #fafafa;
            --card: #fff;
            --border: #e8e8e8;
            --text: #1a1a1a;
            --text-secondary: #888;
            --accent: #1a1a1a;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Login ── */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box {
            width: 100%;
            max-width: 320px;
        }

        .login-box h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 2rem;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            background: var(--card);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 0.75rem;
        }

        .login-box input:focus {
            border-color: #999;
        }

        .login-box button {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .login-box button:hover { opacity: 0.8; }

        .login-error {
            color: #c00;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0.75rem;
            min-height: 1.2em;
        }

        /* ── Dashboard ── */
        .dashboard {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            animation: fadeIn 0.4s ease;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .dash-header h1 {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .dash-header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .dash-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .btn-back {
            text-decoration: none;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .btn-back:hover { color: var(--text); }

        .btn-logout {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            font-family: inherit;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            border-color: #999;
            color: var(--text);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 1.5rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: box-shadow 0.2s;
        }

        .card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* Subtle scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #bbb; }

        .card-title {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        /* ── Weather ── */
        .weather-main {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .weather-temp {
            font-size: 2.5rem;
            font-weight: 200;
            line-height: 1;
        }

        .weather-icon {
            font-size: 2rem;
        }

        .weather-details {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .weather-location {
            font-size: 0.85rem;
            font-weight: 400;
            margin-bottom: 0.25rem;
        }

        /* ── Calendar ── */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 0.75rem;
        }

        .cal-header {
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.3rem 0;
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .cal-day {
            padding: 0.35rem 0;
            border-radius: 6px;
            cursor: default;
        }

        .cal-day.today {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }

        .cal-day.other-month {
            color: #ddd;
        }

        /* ── Todos ── */
        .todo-input-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .todo-input-row input {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            background: var(--bg);
        }

        .todo-input-row input:focus { border-color: #999; }

        .todo-input-row button {
            padding: 0.5rem 0.75rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .todo-input-row button:hover { opacity: 0.8; }

        .todo-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .todo-empty {
            font-size: 0.8rem;
            color: #ccc;
            text-align: center;
            padding: 2rem 0;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.85rem;
        }

        .todo-item:last-child { border-bottom: none; }

        .todo-item input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: all 0.15s;
        }

        .todo-item input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .todo-item input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 10px;
        }

        .todo-item.done .todo-text {
            text-decoration: line-through;
            color: #bbb;
        }

        .todo-text { flex: 1; }

        .todo-delete {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 0.2rem;
            transition: color 0.15s;
        }

        .todo-delete:hover { color: #c00; }

        /* ── Notes ── */
        .notes-area {
            width: 100%;
            min-height: 200px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            font-family: inherit;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }

        .notes-area:focus { border-color: #999; }

        .notes-saved {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 0.5rem;
            min-height: 1em;
        }

        /* ── News ── */
        .news-list {
            list-style: decimal;
            padding-left: 1.4rem;
        }

        .news-item {
            padding: 0.6rem 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .news-item::marker {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .news-item:last-child { border-bottom: none; }

        .news-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.4;
            margin-bottom: 0.3rem;
            text-decoration: none;
            display: block;
            transition: color 0.15s;
        }

        .news-title:hover {
            color: #555;
        }

        .news-title:visited {
            color: var(--text-secondary);
        }

        .news-desc {
            font-size: 0.78rem;
            color: #666;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-meta {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-top: 0.3rem;
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        .news-source-tag {
            background: #f0f0f0;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            font-weight: 500;
        }

        .news-section-title {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .news-section-title:first-child {
            margin-top: 0;
        }

        .news-loading, .weather-loading {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* ── Layout spans ── */
        .card-news { grid-column: 1; grid-row: 1 / 3; max-height: 600px; overflow-y: auto; }
        .card-weather { grid-column: 2; grid-row: 1; }
        .card-calendar { grid-column: 3; grid-row: 1; }
        .card-todos { grid-column: 2; grid-row: 2; }
        .card-notes { grid-column: 3; grid-row: 2; }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
            .card-news { grid-column: 1 / 3; grid-row: auto; max-height: 400px; }
            .card-weather { grid-column: 1; grid-row: auto; }
            .card-calendar { grid-column: 2; grid-row: auto; }
            .card-todos { grid-column: 1; grid-row: auto; }
            .card-notes { grid-column: 2; grid-row: auto; }
        }

        @media (max-width: 600px) {
            .dashboard { padding: 1rem; }
            .grid {
                grid-template-columns: 1fr;
            }
            .card-news,
            .card-weather,
            .card-calendar,
            .card-todos,
            .card-notes {
                grid-column: 1;
                grid-row: auto;
            }
            .card-news { max-height: 350px; }
            .dash-header {
                flex-direction: column;
                gap: 0.75rem;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

<!-- Login -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h1>Dashboard</h1>
        <form id="loginForm">
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" autofocus>
            <button type="submit">Sign in</button>
        </form>
        <p class="login-error" id="loginError"></p>
    </div>
</div>

<!-- Dashboard content is rendered by JS only after authentication -->
<div class="dashboard" id="dashboard"></div>

<script>
(function() {
    const PASS_HASH = 'd88a1030fc943736069d7cb44a01a031a263cacb0ab7cfa7b28eb7d54653bb44';
    const SESSION_KEY = 'dash_session';
    const ATTEMPTS_KEY = 'dash_attempts';
    const LOCKOUT_KEY = 'dash_lockout';
    const WEATHER_CACHE_KEY = 'dash_weather_cache';
    const NEWS_CACHE_KEY = 'dash_news_cache';
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_MS = 60000;
    const CACHE_TTL = 10 * 60 * 1000; // 10 minutes

    async function hashPassword(pw) {
        const data = new TextEncoder().encode(pw);
        const buf = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function isLoggedIn() {
        return localStorage.getItem(SESSION_KEY) === 'true';
    }

    function isLockedOut() {
        const lockUntil = parseInt(sessionStorage.getItem(LOCKOUT_KEY) || '0');
        if (Date.now() < lockUntil) return true;
        if (lockUntil > 0) {
            sessionStorage.removeItem(LOCKOUT_KEY);
            sessionStorage.removeItem(ATTEMPTS_KEY);
        }
        return false;
    }

    function getAttempts() {
        return parseInt(sessionStorage.getItem(ATTEMPTS_KEY) || '0');
    }

    function recordFailedAttempt() {
        const attempts = getAttempts() + 1;
        sessionStorage.setItem(ATTEMPTS_KEY, String(attempts));
        if (attempts >= MAX_ATTEMPTS) {
            sessionStorage.setItem(LOCKOUT_KEY, String(Date.now() + LOCKOUT_MS));
        }
        return attempts;
    }

    function getCached(key) {
        try {
            const cached = JSON.parse(localStorage.getItem(key));
            if (cached && cached.data) return cached;
        } catch {}
        return null;
    }

    function setCache(key, data) {
        localStorage.setItem(key, JSON.stringify({ data, ts: Date.now() }));
    }

    function isCacheFresh(cached) {
        return cached && (Date.now() - cached.ts) < CACHE_TTL;
    }

    // ── Build dashboard DOM (only after auth) ──
    function buildDashboardDOM() {
        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = '';

        // Header
        const header = document.createElement('div');
        header.className = 'dash-header';

        const h1 = document.createElement('h1');
        const hour = new Date().getHours();
        let greeting = 'Good evening';
        if (hour < 12) greeting = 'Good morning';
        else if (hour < 18) greeting = 'Good afternoon';
        h1.textContent = greeting + ', Shane';
        header.appendChild(h1);

        const right = document.createElement('div');
        right.className = 'dash-header-right';

        const dateSpan = document.createElement('span');
        dateSpan.className = 'dash-date';
        dateSpan.textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        right.appendChild(dateSpan);

        const backLink = document.createElement('a');
        backLink.href = 'index.html';
        backLink.className = 'btn-back';
        backLink.textContent = 'Portfolio';
        right.appendChild(backLink);

        const logoutBtn = document.createElement('button');
        logoutBtn.className = 'btn-logout';
        logoutBtn.textContent = 'Sign out';
        logoutBtn.addEventListener('click', function() {
            localStorage.removeItem(SESSION_KEY);
            sessionStorage.removeItem(ATTEMPTS_KEY);
            location.reload();
        });
        right.appendChild(logoutBtn);
        header.appendChild(right);
        dashboard.appendChild(header);

        // Grid
        const grid = document.createElement('div');
        grid.className = 'grid';

        // News card (first — prominent position)
        const newsCard = document.createElement('div');
        newsCard.className = 'card card-news';
        newsCard.innerHTML = '<div class="card-title">News</div><div id="newsContent"><p class="news-loading">Loading news...</p></div><div id="policeContent"></div>';
        grid.appendChild(newsCard);

        // Weather card
        const weatherCard = document.createElement('div');
        weatherCard.className = 'card card-weather';
        weatherCard.innerHTML = '<div class="card-title">Weather · Bern</div><div id="weatherContent"><p class="weather-loading">Loading weather...</p></div>';
        grid.appendChild(weatherCard);

        // Calendar card
        const calCard = document.createElement('div');
        calCard.className = 'card card-calendar';
        calCard.innerHTML = '<div class="card-title" id="calTitle">Calendar</div><div class="cal-grid" id="calGrid"></div>';
        grid.appendChild(calCard);

        // Todos card
        const todosCard = document.createElement('div');
        todosCard.className = 'card card-todos';
        todosCard.innerHTML = '<div class="card-title">Today\'s Tasks</div>';
        const todoInputRow = document.createElement('div');
        todoInputRow.className = 'todo-input-row';
        const todoInput = document.createElement('input');
        todoInput.type = 'text';
        todoInput.id = 'todoInput';
        todoInput.placeholder = 'Add a task...';
        const todoAddBtn = document.createElement('button');
        todoAddBtn.id = 'todoAdd';
        todoAddBtn.textContent = '+';
        todoInputRow.append(todoInput, todoAddBtn);
        const todoList = document.createElement('ul');
        todoList.className = 'todo-list';
        todoList.id = 'todoList';
        todosCard.append(todoInputRow, todoList);
        grid.appendChild(todosCard);

        // Notes card
        const notesCard = document.createElement('div');
        notesCard.className = 'card card-notes';
        notesCard.innerHTML = '<div class="card-title">Notes</div>';
        const notesArea = document.createElement('textarea');
        notesArea.className = 'notes-area';
        notesArea.id = 'notesArea';
        notesArea.placeholder = 'Write something...';
        const notesSaved = document.createElement('div');
        notesSaved.className = 'notes-saved';
        notesSaved.id = 'notesSaved';
        notesCard.append(notesArea, notesSaved);
        grid.appendChild(notesCard);

        dashboard.appendChild(grid);
    }

    function showDashboard() {
        document.getElementById('loginScreen').style.display = 'none';
        const dashboard = document.getElementById('dashboard');
        buildDashboardDOM();
        dashboard.style.display = 'block';
        initWidgets();
    }

    if (isLoggedIn()) {
        showDashboard();
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const errorEl = document.getElementById('loginError');
        const pwInput = document.getElementById('loginPassword');

        if (isLockedOut()) {
            errorEl.textContent = 'Too many attempts. Try again in 1 minute.';
            pwInput.value = '';
            return;
        }

        const pw = pwInput.value;
        const hash = await hashPassword(pw);
        if (hash === PASS_HASH) {
            localStorage.setItem(SESSION_KEY, 'true');
            sessionStorage.removeItem(ATTEMPTS_KEY);
            sessionStorage.removeItem(LOCKOUT_KEY);
            showDashboard();
        } else {
            const attempts = recordFailedAttempt();
            if (attempts >= MAX_ATTEMPTS) {
                errorEl.textContent = 'Too many attempts. Locked for 1 minute.';
            } else {
                errorEl.textContent = 'Incorrect password';
            }
            pwInput.value = '';
        }
    });

    // ── Widget logic (only runs after DOM is built) ──
    function initWidgets() {
        buildCalendar();
        loadTodos();
        loadNotes();
        loadWeather();
        loadNews();
    }

    // ── Calendar ──
    function buildCalendar() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const today = now.getDate();

        document.getElementById('calTitle').textContent = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        const grid = document.getElementById('calGrid');

        ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => {
            const el = document.createElement('div');
            el.className = 'cal-header';
            el.textContent = d;
            grid.appendChild(el);
        });

        const firstDay = new Date(year, month, 1);
        let startDay = firstDay.getDay() - 1;
        if (startDay < 0) startDay = 6;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrev = new Date(year, month, 0).getDate();

        for (let i = startDay - 1; i >= 0; i--) {
            const el = document.createElement('div');
            el.className = 'cal-day other-month';
            el.textContent = daysInPrev - i;
            grid.appendChild(el);
        }
        for (let d = 1; d <= daysInMonth; d++) {
            const el = document.createElement('div');
            el.className = 'cal-day' + (d === today ? ' today' : '');
            el.textContent = d;
            grid.appendChild(el);
        }
        const remaining = (7 - ((startDay + daysInMonth) % 7)) % 7;
        for (let i = 1; i <= remaining; i++) {
            const el = document.createElement('div');
            el.className = 'cal-day other-month';
            el.textContent = i;
            grid.appendChild(el);
        }
    }

    // ── Todos ──
    const TODOS_KEY = 'dash_todos';

    function getTodos() {
        try { return JSON.parse(localStorage.getItem(TODOS_KEY)) || []; }
        catch { return []; }
    }
    function saveTodos(todos) { localStorage.setItem(TODOS_KEY, JSON.stringify(todos)); }

    function renderTodos() {
        const list = document.getElementById('todoList');
        const todos = getTodos();
        list.innerHTML = '';
        if (todos.length === 0) {
            const empty = document.createElement('li');
            empty.className = 'todo-empty';
            empty.textContent = 'No tasks yet';
            list.appendChild(empty);
            return;
        }
        todos.forEach((todo, i) => {
            const li = document.createElement('li');
            li.className = 'todo-item' + (todo.done ? ' done' : '');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = todo.done;
            cb.addEventListener('change', () => { toggleTodo(i); });
            const span = document.createElement('span');
            span.className = 'todo-text';
            span.textContent = todo.text;
            const del = document.createElement('button');
            del.className = 'todo-delete';
            del.textContent = '\u00d7';
            del.addEventListener('click', () => { deleteTodo(i); });
            li.append(cb, span, del);
            list.appendChild(li);
        });
    }

    function addTodo(text) {
        if (!text.trim()) return;
        const todos = getTodos();
        todos.push({ text: text.trim(), done: false });
        saveTodos(todos);
        renderTodos();
    }
    function toggleTodo(i) { const t = getTodos(); t[i].done = !t[i].done; saveTodos(t); renderTodos(); }
    function deleteTodo(i) { const t = getTodos(); t.splice(i, 1); saveTodos(t); renderTodos(); }

    function loadTodos() {
        renderTodos();
        document.getElementById('todoAdd').addEventListener('click', () => {
            const input = document.getElementById('todoInput');
            addTodo(input.value);
            input.value = '';
            input.focus();
        });
        document.getElementById('todoInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { addTodo(e.target.value); e.target.value = ''; }
        });
    }

    // ── Notes ──
    const NOTES_KEY = 'dash_notes';
    let saveTimeout;

    function loadNotes() {
        const area = document.getElementById('notesArea');
        area.value = localStorage.getItem(NOTES_KEY) || '';
        area.addEventListener('input', () => {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem(NOTES_KEY, area.value);
                const saved = document.getElementById('notesSaved');
                saved.textContent = 'Saved';
                setTimeout(() => saved.textContent = '', 1500);
            }, 500);
        });
    }

    // ── Weather ──
    function renderWeatherData(container, weatherData) {
        const temp = Math.round(weatherData.temperature_2m);
        const humidity = weatherData.relative_humidity_2m;
        const wind = Math.round(weatherData.wind_speed_10m);
        const feelsLike = Math.round(weatherData.apparent_temperature);
        const icon = getWeatherIcon(weatherData.weather_code);
        const desc = getWeatherDesc(weatherData.weather_code);
        container.innerHTML = '';
        container.insertAdjacentHTML('beforeend',
            '<div class="weather-main"><span class="weather-icon">' + icon + '</span><span class="weather-temp">' + temp + '\u00b0</span></div>' +
            '<p class="weather-location">' + desc + '</p>' +
            '<div class="weather-details">Feels like ' + feelsLike + '\u00b0<br>Humidity ' + humidity + '% \u00b7 Wind ' + wind + ' km/h</div>'
        );
    }

    async function loadWeather() {
        const container = document.getElementById('weatherContent');

        // Show cached data instantly
        const cached = getCached(WEATHER_CACHE_KEY);
        if (cached) {
            renderWeatherData(container, cached.data);
            if (isCacheFresh(cached)) return; // still fresh, skip fetch
        }

        // Fetch fresh data in background
        try {
            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=46.9481&longitude=7.4474&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Europe/Zurich');
            const data = await res.json();
            const c = data.current;
            setCache(WEATHER_CACHE_KEY, c);
            renderWeatherData(container, c);
        } catch {
            if (!cached) container.innerHTML = '<p class="weather-loading">Unable to load weather</p>';
        }
    }

    function getWeatherIcon(code) {
        if (code === 0) return '\u2600\ufe0f';
        if (code <= 3) return '\u26c5';
        if (code <= 48) return '\u2601\ufe0f';
        if (code <= 67) return '\ud83c\udf27\ufe0f';
        if (code <= 77) return '\ud83c\udf28\ufe0f';
        if (code <= 86) return '\ud83c\udf28\ufe0f';
        if (code <= 99) return '\u26c8\ufe0f';
        return '\ud83c\udf24\ufe0f';
    }

    function getWeatherDesc(code) {
        if (code === 0) return 'Clear sky';
        if (code <= 3) return 'Partly cloudy';
        if (code <= 48) return 'Foggy';
        if (code <= 57) return 'Drizzle';
        if (code <= 67) return 'Rain';
        if (code <= 77) return 'Snow';
        if (code <= 82) return 'Rain showers';
        if (code <= 86) return 'Snow showers';
        if (code <= 99) return 'Thunderstorm';
        return 'Unknown';
    }

    // ── News ──
    function parseRSSItems(xml) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(xml, 'text/xml');
        const items = doc.querySelectorAll('item');
        const results = [];
        items.forEach(item => {
            const title = item.querySelector('title')?.textContent || '';
            const link = item.querySelector('link')?.textContent || '#';
            const pubDate = item.querySelector('pubDate')?.textContent || '';
            const desc = item.querySelector('description')?.textContent || '';
            const source = item.querySelector('source')?.textContent || '';
            results.push({ title, link, pubDate, desc, source });
        });
        return results;
    }

    function stripHTML(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
    }

    function timeAgo(dateStr) {
        const date = new Date(dateStr);
        if (isNaN(date)) return '';
        const diff = Date.now() - date.getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 60) return mins + ' min ago';
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + 'h ago';
        const days = Math.floor(hrs / 24);
        return days + 'd ago';
    }

    function renderNewsItems(container, items, maxItems, startNum) {
        const ol = document.createElement('ol');
        ol.className = 'news-list';
        ol.start = startNum || 1;
        items.slice(0, maxItems).forEach(item => {
            const li = document.createElement('li');
            li.className = 'news-item';

            const titleLink = document.createElement('a');
            titleLink.className = 'news-title';
            titleLink.href = item.link || '#';
            titleLink.target = '_blank';
            titleLink.rel = 'noopener noreferrer';
            titleLink.textContent = item.title;
            li.appendChild(titleLink);

            const cleanDesc = stripHTML(item.desc).trim();
            if (cleanDesc && cleanDesc !== item.title) {
                const descEl = document.createElement('div');
                descEl.className = 'news-desc';
                descEl.textContent = cleanDesc;
                li.appendChild(descEl);
            }

            const meta = document.createElement('div');
            meta.className = 'news-meta';
            if (item.pubDate) {
                const time = document.createElement('span');
                time.textContent = timeAgo(item.pubDate);
                meta.appendChild(time);
            }
            li.appendChild(meta);
            ol.appendChild(li);
        });
        container.appendChild(ol);
    }

    // JSONP fetch — bypasses CORS by loading via <script> tag
    function fetchJSONP(url) {
        return new Promise((resolve, reject) => {
            const cbName = '_jsonp_' + Math.random().toString(36).slice(2);
            const timer = setTimeout(() => {
                delete window[cbName];
                if (script.parentNode) script.parentNode.removeChild(script);
                reject(new Error('timeout'));
            }, 10000);
            window[cbName] = function(data) {
                clearTimeout(timer);
                delete window[cbName];
                if (script.parentNode) script.parentNode.removeChild(script);
                resolve(data);
            };
            const script = document.createElement('script');
            script.src = url + '&callback=' + cbName;
            script.onerror = function() {
                clearTimeout(timer);
                delete window[cbName];
                if (script.parentNode) script.parentNode.removeChild(script);
                reject(new Error('load error'));
            };
            document.head.appendChild(script);
        });
    }

    async function fetchRss2jsonJSONP(rssUrl) {
        try {
            const data = await fetchJSONP('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl));
            if (data.status !== 'ok' || !data.items) return null;
            return data.items.map(i => ({
                title: i.title || '',
                link: i.link || '#',
                pubDate: i.pubDate || '',
                desc: i.description || '',
                source: i.author || ''
            }));
        } catch {
            return null;
        }
    }

    function renderNewsSections(newsContainer, policeContainer, newsData) {
        newsContainer.innerHTML = '';
        if (newsData.bernItems && newsData.bernItems.length > 0) {
            const sectionTitle = document.createElement('div');
            sectionTitle.className = 'news-section-title';
            sectionTitle.textContent = 'Aktuell';
            newsContainer.appendChild(sectionTitle);
            renderNewsItems(newsContainer, newsData.bernItems, 6, 1);
        } else {
            newsContainer.innerHTML = '<p class="news-loading">Unable to load news</p>';
        }

        policeContainer.innerHTML = '';
        if (newsData.regionalItems && newsData.regionalItems.length > 0) {
            const sectionTitle = document.createElement('div');
            sectionTitle.className = 'news-section-title';
            sectionTitle.textContent = 'Regional';
            policeContainer.appendChild(sectionTitle);
            const startNum = Math.min((newsData.bernItems || []).length, 6) + 1;
            renderNewsItems(policeContainer, newsData.regionalItems, 4, startNum);
        }
    }

    async function loadNews() {
        const newsContainer = document.getElementById('newsContent');
        const policeContainer = document.getElementById('policeContent');

        // Show cached news instantly
        const cached = getCached(NEWS_CACHE_KEY);
        if (cached) {
            renderNewsSections(newsContainer, policeContainer, cached.data);
            if (isCacheFresh(cached)) return;
        }

        // Fetch fresh data
        const [bernItems, regionalItems] = await Promise.all([
            fetchRss2jsonJSONP('https://www.nzz.ch/recent.rss'),
            fetchRss2jsonJSONP('https://www.nzz.ch/zuerich.rss')
        ]);

        const newsData = { bernItems: bernItems || [], regionalItems: regionalItems || [] };
        if (bernItems || regionalItems) {
            setCache(NEWS_CACHE_KEY, newsData);
        }
        renderNewsSections(newsContainer, policeContainer, newsData);
    }

})();
</script>
