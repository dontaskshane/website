<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦠</text></svg>">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --bg: #fafafa;
            --card: #fff;
            --border: #e8e8e8;
            --text: #1a1a1a;
            --text-secondary: #888;
            --accent: #1a1a1a;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* -- Login -- */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box {
            width: 100%;
            max-width: 320px;
        }

        .login-box h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 2rem;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            background: var(--card);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 0.75rem;
        }

        .login-box input:focus {
            border-color: #999;
        }

        .login-box button {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .login-box button:hover { opacity: 0.8; }

        .login-error {
            color: #c00;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0.75rem;
            min-height: 1.2em;
        }

        /* -- Dashboard -- */
        .dashboard {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            animation: fadeIn 0.4s ease;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .dash-header h1 {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .dash-header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .dash-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .btn-back {
            text-decoration: none;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .btn-back:hover { color: var(--text); }

        .btn-logout {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            font-family: inherit;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            border-color: #999;
            color: var(--text);
        }

        .storage-warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
            color: #856404;
            display: none;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 1.5rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: box-shadow 0.2s;
        }

        .card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* Subtle scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #bbb; }

        .card-title {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        /* -- Weather -- */
        .weather-main {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .weather-temp {
            font-size: 2.5rem;
            font-weight: 200;
            line-height: 1;
        }

        .weather-icon {
            font-size: 2rem;
        }

        .weather-details {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .weather-location {
            font-size: 0.85rem;
            font-weight: 400;
            margin-bottom: 0.25rem;
        }

        /* -- Calendar -- */
        .cal-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .cal-nav-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.15s;
        }

        .cal-nav-btn:hover {
            border-color: #999;
            color: var(--text);
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 0.75rem;
        }

        .cal-header {
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.3rem 0;
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .cal-day {
            padding: 0.35rem 0;
            border-radius: 6px;
            cursor: default;
            position: relative;
        }

        .cal-day.today {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }

        .cal-day.other-month {
            color: #ddd;
        }

        .cal-day.holiday {
            color: #c0392b;
            font-weight: 600;
        }

        .cal-day.holiday.today {
            background: #c0392b;
            color: #fff;
        }

        .cal-day .cal-holiday-dot {
            position: absolute;
            bottom: 1px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #c0392b;
        }

        .cal-day.today .cal-holiday-dot {
            background: #fff;
        }

        .cal-holiday-tooltip {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: #fff;
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            font-size: 0.65rem;
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
        }

        .cal-day:hover .cal-holiday-tooltip {
            display: block;
        }

        .cal-legend {
            margin-top: 0.75rem;
            padding-top: 0.5rem;
            border-top: 1px solid #f0f0f0;
            font-size: 0.65rem;
            color: var(--text-secondary);
            max-height: 80px;
            overflow-y: auto;
        }

        .cal-legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.15rem 0;
        }

        .cal-legend-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #c0392b;
            flex-shrink: 0;
        }

        /* -- Todos -- */
        .todo-input-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .todo-input-row input {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            background: var(--bg);
        }

        .todo-input-row input:focus { border-color: #999; }

        .todo-input-row button {
            padding: 0.5rem 0.75rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .todo-input-row button:hover { opacity: 0.8; }

        .todo-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .todo-empty {
            font-size: 0.8rem;
            color: #ccc;
            text-align: center;
            padding: 2rem 0;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.85rem;
        }

        .todo-item:last-child { border-bottom: none; }

        .todo-item input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: all 0.15s;
        }

        .todo-item input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .todo-item input[type="checkbox"]:checked::after {
            content: '\2713';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 10px;
        }

        .todo-item.done .todo-text {
            text-decoration: line-through;
            color: #bbb;
        }

        .todo-text { flex: 1; }

        .todo-delete {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 0.2rem;
            transition: color 0.15s;
        }

        .todo-delete:hover { color: #c00; }

        /* -- Notes (Quill) -- */
        .notes-editor-wrapper {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg);
        }

        .notes-editor-wrapper .ql-toolbar {
            border: none;
            border-bottom: 1px solid var(--border);
            background: var(--card);
            padding: 0.4rem;
        }

        .notes-editor-wrapper .ql-container {
            border: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.85rem;
        }

        .notes-editor-wrapper .ql-editor {
            min-height: 160px;
            max-height: 250px;
            overflow-y: auto;
            line-height: 1.6;
            padding: 0.75rem 1rem;
        }

        .notes-editor-wrapper .ql-editor.ql-blank::before {
            font-style: normal;
            color: #ccc;
        }

        .notes-saved {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 0.5rem;
            min-height: 1em;
        }

        /* -- News -- */
        .news-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .news-tab {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .news-tab:hover {
            color: var(--text);
        }

        .news-tab.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .news-list {
            list-style: decimal;
            padding-left: 1.4rem;
        }

        .news-item {
            padding: 0.6rem 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .news-item::marker {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .news-item:last-child { border-bottom: none; }

        .news-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.4;
            margin-bottom: 0.3rem;
            text-decoration: none;
            display: block;
            transition: color 0.15s;
        }

        .news-title:hover {
            color: #555;
        }

        .news-title:visited {
            color: var(--text-secondary);
        }

        .news-desc {
            font-size: 0.78rem;
            color: #666;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-meta {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-top: 0.3rem;
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        .news-source-tag {
            background: #f0f0f0;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            font-weight: 500;
        }

        .news-section-title {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .news-section-title:first-child {
            margin-top: 0;
        }

        .news-loading, .weather-loading {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* -- Layout spans -- */
        .card-news { grid-column: 1; grid-row: 1 / 3; overflow-y: auto; }
        .card-weather { grid-column: 2; grid-row: 1; }
        .card-calendar { grid-column: 3; grid-row: 1; }
        .card-todos { grid-column: 2; grid-row: 2; }
        .card-notes { grid-column: 3; grid-row: 2; }

        /* -- Responsive -- */
        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
            .card-news { grid-column: 1 / 3; grid-row: auto; max-height: 500px; }
            .card-weather { grid-column: 1; grid-row: auto; }
            .card-calendar { grid-column: 2; grid-row: auto; }
            .card-todos { grid-column: 1; grid-row: auto; }
            .card-notes { grid-column: 2; grid-row: auto; }
        }

        @media (max-width: 600px) {
            .dashboard { padding: 1rem; }
            .grid {
                grid-template-columns: 1fr;
            }
            .card-news,
            .card-weather,
            .card-calendar,
            .card-todos,
            .card-notes {
                grid-column: 1;
                grid-row: auto;
            }
            .card-news { max-height: 400px; }
            .dash-header {
                flex-direction: column;
                gap: 0.75rem;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

<!-- Login -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h1>Dashboard</h1>
        <form id="loginForm">
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" autofocus>
            <button type="submit">Sign in</button>
        </form>
        <p class="login-error" id="loginError"></p>
    </div>
</div>

<!-- Dashboard content is rendered by JS only after authentication -->
<div class="dashboard" id="dashboard"></div>

<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script>
(function() {
    const PASS_HASH = 'd88a1030fc943736069d7cb44a01a031a263cacb0ab7cfa7b28eb7d54653bb44';
    const SESSION_KEY = 'dash_session';
    const ATTEMPTS_KEY = 'dash_attempts';
    const LOCKOUT_KEY = 'dash_lockout';
    const WEATHER_CACHE_KEY = 'dash_weather_cache';
    const NEWS_CACHE_KEY = 'dash_news_cache';
    const TECH_NEWS_CACHE_KEY = 'dash_tech_news_cache';
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_MS = 60000;
    const CACHE_TTL = 10 * 60 * 1000;

    // -- Robust Storage Wrapper --
    const Storage = {
        _available: null,

        isAvailable: function() {
            if (this._available !== null) return this._available;
            try {
                const testKey = '__storage_test__';
                localStorage.setItem(testKey, 'test');
                const result = localStorage.getItem(testKey);
                localStorage.removeItem(testKey);
                this._available = result === 'test';
            } catch (e) {
                this._available = false;
            }
            return this._available;
        },

        get: function(key, fallback) {
            if (!this.isAvailable()) return fallback !== undefined ? fallback : null;
            try {
                const val = localStorage.getItem(key);
                return val !== null ? val : (fallback !== undefined ? fallback : null);
            } catch (e) {
                console.warn('Storage read error for ' + key, e);
                return fallback !== undefined ? fallback : null;
            }
        },

        set: function(key, value) {
            if (!this.isAvailable()) return false;
            try {
                localStorage.setItem(key, value);
                // Verify write
                const check = localStorage.getItem(key);
                if (check !== value) {
                    console.warn('Storage verification failed for ' + key);
                    return false;
                }
                return true;
            } catch (e) {
                console.warn('Storage write error for ' + key, e);
                if (e.name === 'QuotaExceededError') {
                    showStorageWarning('Storage is full. Some data may not be saved.');
                }
                return false;
            }
        },

        getJSON: function(key, fallback) {
            const val = this.get(key);
            if (val === null) return fallback !== undefined ? fallback : null;
            try {
                return JSON.parse(val);
            } catch (e) {
                return fallback !== undefined ? fallback : null;
            }
        },

        setJSON: function(key, value) {
            return this.set(key, JSON.stringify(value));
        },

        remove: function(key) {
            if (!this.isAvailable()) return;
            try { localStorage.removeItem(key); } catch (e) {}
        }
    };

    // Request persistent storage
    if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(function() {});
    }

    let storageWarningEl = null;
    function showStorageWarning(msg) {
        if (storageWarningEl) {
            storageWarningEl.textContent = msg;
            storageWarningEl.style.display = 'block';
        }
    }

    async function hashPassword(pw) {
        const data = new TextEncoder().encode(pw);
        const buf = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    }

    function isLoggedIn() {
        return Storage.get(SESSION_KEY) === 'true';
    }

    function isLockedOut() {
        const lockUntil = parseInt(sessionStorage.getItem(LOCKOUT_KEY) || '0');
        if (Date.now() < lockUntil) return true;
        if (lockUntil > 0) {
            sessionStorage.removeItem(LOCKOUT_KEY);
            sessionStorage.removeItem(ATTEMPTS_KEY);
        }
        return false;
    }

    function getAttempts() {
        return parseInt(sessionStorage.getItem(ATTEMPTS_KEY) || '0');
    }

    function recordFailedAttempt() {
        const attempts = getAttempts() + 1;
        sessionStorage.setItem(ATTEMPTS_KEY, String(attempts));
        if (attempts >= MAX_ATTEMPTS) {
            sessionStorage.setItem(LOCKOUT_KEY, String(Date.now() + LOCKOUT_MS));
        }
        return attempts;
    }

    function getCached(key) {
        const cached = Storage.getJSON(key);
        if (cached && cached.data) return cached;
        return null;
    }

    function setCache(key, data) {
        Storage.setJSON(key, { data: data, ts: Date.now() });
    }

    function isCacheFresh(cached) {
        return cached && (Date.now() - cached.ts) < CACHE_TTL;
    }

    // -- Swiss/Bern Holidays --
    function computeEaster(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31) - 1;
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month, day);
    }

    function addDays(date, days) {
        const d = new Date(date);
        d.setDate(d.getDate() + days);
        return d;
    }

    function getBernHolidays(year) {
        const easter = computeEaster(year);
        const holidays = {};
        const add = function(date, name) {
            const key = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
            holidays[key] = name;
        };

        add(new Date(year, 0, 1), 'Neujahr');
        add(new Date(year, 0, 2), 'Berchtoldstag');
        add(addDays(easter, -2), 'Karfreitag');
        add(addDays(easter, 0), 'Ostersonntag');
        add(addDays(easter, 1), 'Ostermontag');
        add(addDays(easter, 39), 'Auffahrt');
        add(addDays(easter, 49), 'Pfingstsonntag');
        add(addDays(easter, 50), 'Pfingstmontag');
        add(new Date(year, 7, 1), 'Bundesfeiertag');
        add(new Date(year, 11, 25), 'Weihnachten');
        add(new Date(year, 11, 26), 'Stephanstag');

        return holidays;
    }

    // -- Build dashboard DOM --
    function buildDashboardDOM() {
        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = '';

        // Storage warning
        storageWarningEl = document.createElement('div');
        storageWarningEl.className = 'storage-warning';
        storageWarningEl.id = 'storageWarning';
        dashboard.appendChild(storageWarningEl);

        if (!Storage.isAvailable()) {
            showStorageWarning('Local storage is not available. Your data (notes, todos) will not be saved between sessions. Check your browser privacy settings.');
        }

        // Header
        const header = document.createElement('div');
        header.className = 'dash-header';

        const h1 = document.createElement('h1');
        const hour = new Date().getHours();
        let greeting = 'Good evening';
        if (hour < 12) greeting = 'Good morning';
        else if (hour < 18) greeting = 'Good afternoon';
        h1.textContent = greeting + ', Shane';
        header.appendChild(h1);

        const right = document.createElement('div');
        right.className = 'dash-header-right';

        const dateSpan = document.createElement('span');
        dateSpan.className = 'dash-date';
        dateSpan.textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        right.appendChild(dateSpan);

        const backLink = document.createElement('a');
        backLink.href = 'index.html';
        backLink.className = 'btn-back';
        backLink.textContent = 'Portfolio';
        right.appendChild(backLink);

        const logoutBtn = document.createElement('button');
        logoutBtn.className = 'btn-logout';
        logoutBtn.textContent = 'Sign out';
        logoutBtn.addEventListener('click', function() {
            Storage.remove(SESSION_KEY);
            sessionStorage.removeItem(ATTEMPTS_KEY);
            location.reload();
        });
        right.appendChild(logoutBtn);
        header.appendChild(right);
        dashboard.appendChild(header);

        // Grid
        const grid = document.createElement('div');
        grid.className = 'grid';

        // News card
        const newsCard = document.createElement('div');
        newsCard.className = 'card card-news';
        newsCard.innerHTML = '<div class="card-title">News</div>' +
            '<div class="news-tabs" id="newsTabs">' +
            '<button class="news-tab active" data-tab="news">News</button>' +
            '<button class="news-tab" data-tab="tech">Tech</button>' +
            '</div>' +
            '<div id="newsPanel"><div id="newsContent"><p class="news-loading">Loading news...</p></div><div id="policeContent"></div></div>' +
            '<div id="techPanel" style="display:none"><div id="techContent"><p class="news-loading">Loading tech news...</p></div></div>';
        grid.appendChild(newsCard);

        // Weather card
        const weatherCard = document.createElement('div');
        weatherCard.className = 'card card-weather';
        weatherCard.innerHTML = '<div class="card-title">Weather \u00b7 Bern</div><div id="weatherContent"><p class="weather-loading">Loading weather...</p></div>';
        grid.appendChild(weatherCard);

        // Calendar card
        const calCard = document.createElement('div');
        calCard.className = 'card card-calendar';
        calCard.innerHTML = '<div class="card-title">Calendar</div>' +
            '<div class="cal-nav"><button class="cal-nav-btn" id="calPrev">\u2039</button><span id="calTitle"></span><button class="cal-nav-btn" id="calNext">\u203a</button></div>' +
            '<div class="cal-grid" id="calGrid"></div>' +
            '<div class="cal-legend" id="calLegend"></div>';
        grid.appendChild(calCard);

        // Todos card
        const todosCard = document.createElement('div');
        todosCard.className = 'card card-todos';
        todosCard.innerHTML = '<div class="card-title">Today\'s Tasks</div>';
        const todoInputRow = document.createElement('div');
        todoInputRow.className = 'todo-input-row';
        const todoInput = document.createElement('input');
        todoInput.type = 'text';
        todoInput.id = 'todoInput';
        todoInput.placeholder = 'Add a task...';
        const todoAddBtn = document.createElement('button');
        todoAddBtn.id = 'todoAdd';
        todoAddBtn.textContent = '+';
        todoInputRow.append(todoInput, todoAddBtn);
        const todoList = document.createElement('ul');
        todoList.className = 'todo-list';
        todoList.id = 'todoList';
        todosCard.append(todoInputRow, todoList);
        grid.appendChild(todosCard);

        // Notes card (Quill)
        const notesCard = document.createElement('div');
        notesCard.className = 'card card-notes';
        notesCard.innerHTML = '<div class="card-title">Notes</div>' +
            '<div class="notes-editor-wrapper"><div id="notesEditor"></div></div>' +
            '<div class="notes-saved" id="notesSaved"></div>';
        grid.appendChild(notesCard);

        dashboard.appendChild(grid);
    }

    function showDashboard() {
        document.getElementById('loginScreen').style.display = 'none';
        const dashboard = document.getElementById('dashboard');
        buildDashboardDOM();
        dashboard.style.display = 'block';
        initWidgets();
    }

    if (isLoggedIn()) {
        showDashboard();
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const errorEl = document.getElementById('loginError');
        const pwInput = document.getElementById('loginPassword');

        if (isLockedOut()) {
            errorEl.textContent = 'Too many attempts. Try again in 1 minute.';
            pwInput.value = '';
            return;
        }

        const pw = pwInput.value;
        const hash = await hashPassword(pw);
        if (hash === PASS_HASH) {
            Storage.set(SESSION_KEY, 'true');
            sessionStorage.removeItem(ATTEMPTS_KEY);
            sessionStorage.removeItem(LOCKOUT_KEY);
            showDashboard();
        } else {
            const attempts = recordFailedAttempt();
            if (attempts >= MAX_ATTEMPTS) {
                errorEl.textContent = 'Too many attempts. Locked for 1 minute.';
            } else {
                errorEl.textContent = 'Incorrect password';
            }
            pwInput.value = '';
        }
    });

    // -- Widget logic --
    let quillInstance = null;

    function initWidgets() {
        initCalendar();
        loadTodos();
        initNotes();
        loadWeather();
        loadNews();
        loadTechNews();
        initNewsTabs();

        // Force save on page unload
        window.addEventListener('beforeunload', function() {
            if (quillInstance) {
                const contents = quillInstance.getContents();
                Storage.setJSON('dash_notes', contents);
            }
        });
    }

    // -- Calendar with navigation and holidays --
    let calYear, calMonth;

    function initCalendar() {
        const now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth();
        buildCalendar(calYear, calMonth);

        document.getElementById('calPrev').addEventListener('click', function() {
            calMonth--;
            if (calMonth < 0) { calMonth = 11; calYear--; }
            buildCalendar(calYear, calMonth);
        });
        document.getElementById('calNext').addEventListener('click', function() {
            calMonth++;
            if (calMonth > 11) { calMonth = 0; calYear++; }
            buildCalendar(calYear, calMonth);
        });
    }

    function buildCalendar(year, month) {
        const now = new Date();
        const isCurrentMonth = year === now.getFullYear() && month === now.getMonth();
        const today = isCurrentMonth ? now.getDate() : -1;

        const titleEl = document.getElementById('calTitle');
        titleEl.textContent = new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        const grid = document.getElementById('calGrid');
        grid.innerHTML = '';

        const holidays = getBernHolidays(year);

        ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d) {
            const el = document.createElement('div');
            el.className = 'cal-header';
            el.textContent = d;
            grid.appendChild(el);
        });

        const firstDay = new Date(year, month, 1);
        let startDay = firstDay.getDay() - 1;
        if (startDay < 0) startDay = 6;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrev = new Date(year, month, 0).getDate();

        for (let i = startDay - 1; i >= 0; i--) {
            const el = document.createElement('div');
            el.className = 'cal-day other-month';
            el.textContent = daysInPrev - i;
            grid.appendChild(el);
        }

        const monthHolidays = [];
        for (let d = 1; d <= daysInMonth; d++) {
            const el = document.createElement('div');
            const dateKey = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            const holidayName = holidays[dateKey];
            let cls = 'cal-day';
            if (d === today) cls += ' today';
            if (holidayName) cls += ' holiday';
            el.className = cls;
            el.textContent = d;
            el.style.position = 'relative';

            if (holidayName) {
                const dot = document.createElement('span');
                dot.className = 'cal-holiday-dot';
                el.appendChild(dot);
                const tooltip = document.createElement('span');
                tooltip.className = 'cal-holiday-tooltip';
                tooltip.textContent = holidayName;
                el.appendChild(tooltip);
                monthHolidays.push({ day: d, name: holidayName });
            }
            grid.appendChild(el);
        }

        const remaining = (7 - ((startDay + daysInMonth) % 7)) % 7;
        for (let i = 1; i <= remaining; i++) {
            const el = document.createElement('div');
            el.className = 'cal-day other-month';
            el.textContent = i;
            grid.appendChild(el);
        }

        // Legend
        const legend = document.getElementById('calLegend');
        legend.innerHTML = '';
        if (monthHolidays.length > 0) {
            monthHolidays.forEach(function(h) {
                const item = document.createElement('div');
                item.className = 'cal-legend-item';
                item.innerHTML = '<span class="cal-legend-dot"></span><span>' + h.day + '. ' + h.name + '</span>';
                legend.appendChild(item);
            });
        }
    }

    // -- Todos --
    const TODOS_KEY = 'dash_todos';

    function getTodos() {
        return Storage.getJSON(TODOS_KEY, []);
    }

    function saveTodos(todos) {
        Storage.setJSON(TODOS_KEY, todos);
    }

    function renderTodos() {
        const list = document.getElementById('todoList');
        const todos = getTodos();
        list.innerHTML = '';
        if (todos.length === 0) {
            const empty = document.createElement('li');
            empty.className = 'todo-empty';
            empty.textContent = 'No tasks yet';
            list.appendChild(empty);
            return;
        }
        todos.forEach(function(todo, i) {
            const li = document.createElement('li');
            li.className = 'todo-item' + (todo.done ? ' done' : '');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = todo.done;
            cb.addEventListener('change', function() { toggleTodo(i); });
            const span = document.createElement('span');
            span.className = 'todo-text';
            span.textContent = todo.text;
            const del = document.createElement('button');
            del.className = 'todo-delete';
            del.textContent = '\u00d7';
            del.addEventListener('click', function() { deleteTodo(i); });
            li.append(cb, span, del);
            list.appendChild(li);
        });
    }

    function addTodo(text) {
        if (!text.trim()) return;
        const todos = getTodos();
        todos.push({ text: text.trim(), done: false });
        saveTodos(todos);
        renderTodos();
    }

    function toggleTodo(i) {
        const t = getTodos();
        t[i].done = !t[i].done;
        saveTodos(t);
        renderTodos();
    }

    function deleteTodo(i) {
        const t = getTodos();
        t.splice(i, 1);
        saveTodos(t);
        renderTodos();
    }

    function loadTodos() {
        renderTodos();
        document.getElementById('todoAdd').addEventListener('click', function() {
            const input = document.getElementById('todoInput');
            addTodo(input.value);
            input.value = '';
            input.focus();
        });
        document.getElementById('todoInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { addTodo(e.target.value); e.target.value = ''; }
        });
    }

    // -- Notes (Quill rich text) --
    const NOTES_KEY = 'dash_notes';
    let notesSaveTimeout;

    function initNotes() {
        quillInstance = new Quill('#notesEditor', {
            theme: 'snow',
            placeholder: 'Write something...',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'header': [1, 2, 3, false] }],
                    [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                    ['blockquote', 'code-block'],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link'],
                    ['clean']
                ]
            }
        });

        // Load saved content
        const saved = Storage.getJSON(NOTES_KEY);
        if (saved) {
            if (saved.ops) {
                // Quill Delta format
                quillInstance.setContents(saved);
            } else if (typeof saved === 'string') {
                // Legacy plain text
                quillInstance.setText(saved);
            }
        } else {
            // Check for legacy plain text format
            const legacyText = Storage.get(NOTES_KEY);
            if (legacyText && legacyText.trim()) {
                quillInstance.setText(legacyText);
            }
        }

        quillInstance.on('text-change', function() {
            clearTimeout(notesSaveTimeout);
            notesSaveTimeout = setTimeout(function() {
                const contents = quillInstance.getContents();
                const success = Storage.setJSON(NOTES_KEY, contents);
                const savedEl = document.getElementById('notesSaved');
                if (success) {
                    savedEl.textContent = 'Saved';
                } else {
                    savedEl.textContent = 'Failed to save!';
                    savedEl.style.color = '#c00';
                }
                setTimeout(function() {
                    savedEl.textContent = '';
                    savedEl.style.color = '#aaa';
                }, 1500);
            }, 500);
        });
    }

    // -- Weather --
    function renderWeatherData(container, weatherData) {
        const temp = Math.round(weatherData.temperature_2m);
        const humidity = weatherData.relative_humidity_2m;
        const wind = Math.round(weatherData.wind_speed_10m);
        const feelsLike = Math.round(weatherData.apparent_temperature);
        const icon = getWeatherIcon(weatherData.weather_code);
        const desc = getWeatherDesc(weatherData.weather_code);
        container.innerHTML = '';
        container.insertAdjacentHTML('beforeend',
            '<div class="weather-main"><span class="weather-icon">' + icon + '</span><span class="weather-temp">' + temp + '\u00b0</span></div>' +
            '<p class="weather-location">' + desc + '</p>' +
            '<div class="weather-details">Feels like ' + feelsLike + '\u00b0<br>Humidity ' + humidity + '% \u00b7 Wind ' + wind + ' km/h</div>'
        );
    }

    async function loadWeather() {
        const container = document.getElementById('weatherContent');

        const cached = getCached(WEATHER_CACHE_KEY);
        if (cached) {
            renderWeatherData(container, cached.data);
            if (isCacheFresh(cached)) return;
        }

        try {
            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=46.9481&longitude=7.4474&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Europe/Zurich');
            const data = await res.json();
            const c = data.current;
            setCache(WEATHER_CACHE_KEY, c);
            renderWeatherData(container, c);
        } catch (e) {
            if (!cached) container.innerHTML = '<p class="weather-loading">Unable to load weather</p>';
        }
    }

    function getWeatherIcon(code) {
        if (code === 0) return '\u2600\ufe0f';
        if (code <= 3) return '\u26c5';
        if (code <= 48) return '\u2601\ufe0f';
        if (code <= 67) return '\ud83c\udf27\ufe0f';
        if (code <= 77) return '\ud83c\udf28\ufe0f';
        if (code <= 86) return '\ud83c\udf28\ufe0f';
        if (code <= 99) return '\u26c8\ufe0f';
        return '\ud83c\udf24\ufe0f';
    }

    function getWeatherDesc(code) {
        if (code === 0) return 'Clear sky';
        if (code <= 3) return 'Partly cloudy';
        if (code <= 48) return 'Foggy';
        if (code <= 57) return 'Drizzle';
        if (code <= 67) return 'Rain';
        if (code <= 77) return 'Snow';
        if (code <= 82) return 'Rain showers';
        if (code <= 86) return 'Snow showers';
        if (code <= 99) return 'Thunderstorm';
        return 'Unknown';
    }

    // -- News --
    function stripHTML(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
    }

    function timeAgo(dateStr) {
        const date = new Date(dateStr);
        if (isNaN(date)) return '';
        const diff = Date.now() - date.getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 60) return mins + ' min ago';
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + 'h ago';
        const days = Math.floor(hrs / 24);
        return days + 'd ago';
    }

    function renderNewsItems(container, items, maxItems, startNum) {
        const ol = document.createElement('ol');
        ol.className = 'news-list';
        ol.start = startNum || 1;
        items.slice(0, maxItems).forEach(function(item) {
            const li = document.createElement('li');
            li.className = 'news-item';

            const titleLink = document.createElement('a');
            titleLink.className = 'news-title';
            titleLink.href = item.link || '#';
            titleLink.target = '_blank';
            titleLink.rel = 'noopener noreferrer';
            titleLink.textContent = item.title;
            li.appendChild(titleLink);

            const cleanDesc = stripHTML(item.desc).trim();
            if (cleanDesc && cleanDesc !== item.title) {
                const descEl = document.createElement('div');
                descEl.className = 'news-desc';
                descEl.textContent = cleanDesc;
                li.appendChild(descEl);
            }

            const meta = document.createElement('div');
            meta.className = 'news-meta';
            if (item.source) {
                const sourceTag = document.createElement('span');
                sourceTag.className = 'news-source-tag';
                sourceTag.textContent = item.source;
                meta.appendChild(sourceTag);
            }
            if (item.pubDate) {
                const time = document.createElement('span');
                time.textContent = timeAgo(item.pubDate);
                meta.appendChild(time);
            }
            li.appendChild(meta);
            ol.appendChild(li);
        });
        container.appendChild(ol);
    }

    // JSONP fetch
    function fetchJSONP(url) {
        return new Promise(function(resolve, reject) {
            const cbName = '_jsonp_' + Math.random().toString(36).slice(2);
            const timer = setTimeout(function() {
                delete window[cbName];
                if (script.parentNode) script.parentNode.removeChild(script);
                reject(new Error('timeout'));
            }, 10000);
            window[cbName] = function(data) {
                clearTimeout(timer);
                delete window[cbName];
                if (script.parentNode) script.parentNode.removeChild(script);
                resolve(data);
            };
            const script = document.createElement('script');
            script.src = url + '&callback=' + cbName;
            script.onerror = function() {
                clearTimeout(timer);
                delete window[cbName];
                if (script.parentNode) script.parentNode.removeChild(script);
                reject(new Error('load error'));
            };
            document.head.appendChild(script);
        });
    }

    async function fetchRss2jsonJSONP(rssUrl) {
        try {
            const data = await fetchJSONP('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl));
            if (data.status !== 'ok' || !data.items) return null;
            return data.items.map(function(i) {
                return {
                    title: i.title || '',
                    link: i.link || '#',
                    pubDate: i.pubDate || '',
                    desc: i.description || '',
                    source: i.author || ''
                };
            });
        } catch (e) {
            return null;
        }
    }

    // News tabs
    function initNewsTabs() {
        const tabs = document.querySelectorAll('.news-tab');
        tabs.forEach(function(tab) {
            tab.addEventListener('click', function() {
                tabs.forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                const target = tab.getAttribute('data-tab');
                document.getElementById('newsPanel').style.display = target === 'news' ? 'block' : 'none';
                document.getElementById('techPanel').style.display = target === 'tech' ? 'block' : 'none';
            });
        });
    }

    function renderNewsSections(newsContainer, policeContainer, newsData) {
        newsContainer.innerHTML = '';
        if (newsData.bernItems && newsData.bernItems.length > 0) {
            const sectionTitle = document.createElement('div');
            sectionTitle.className = 'news-section-title';
            sectionTitle.textContent = 'Aktuell';
            newsContainer.appendChild(sectionTitle);
            renderNewsItems(newsContainer, newsData.bernItems, 8, 1);
        } else {
            newsContainer.innerHTML = '<p class="news-loading">Unable to load news</p>';
        }

        policeContainer.innerHTML = '';
        if (newsData.regionalItems && newsData.regionalItems.length > 0) {
            const sectionTitle = document.createElement('div');
            sectionTitle.className = 'news-section-title';
            sectionTitle.textContent = 'Regional';
            policeContainer.appendChild(sectionTitle);
            const startNum = Math.min((newsData.bernItems || []).length, 8) + 1;
            renderNewsItems(policeContainer, newsData.regionalItems, 5, startNum);
        }
    }

    async function loadNews() {
        const newsContainer = document.getElementById('newsContent');
        const policeContainer = document.getElementById('policeContent');

        const cached = getCached(NEWS_CACHE_KEY);
        if (cached) {
            renderNewsSections(newsContainer, policeContainer, cached.data);
            if (isCacheFresh(cached)) return;
        }

        const [bernItems, regionalItems] = await Promise.all([
            fetchRss2jsonJSONP('https://www.nzz.ch/recent.rss'),
            fetchRss2jsonJSONP('https://www.nzz.ch/zuerich.rss')
        ]);

        const newsData = { bernItems: bernItems || [], regionalItems: regionalItems || [] };
        if (bernItems || regionalItems) {
            setCache(NEWS_CACHE_KEY, newsData);
        }
        renderNewsSections(newsContainer, policeContainer, newsData);
    }

    // Tech news
    function renderTechNews(container, techData) {
        container.innerHTML = '';
        if (techData.length === 0) {
            container.innerHTML = '<p class="news-loading">Unable to load tech news</p>';
            return;
        }

        // Merge and sort by date
        const allItems = techData.flat().sort(function(a, b) {
            return new Date(b.pubDate) - new Date(a.pubDate);
        });

        renderNewsItems(container, allItems, 12, 1);
    }

    async function loadTechNews() {
        const container = document.getElementById('techContent');

        const cached = getCached(TECH_NEWS_CACHE_KEY);
        if (cached) {
            renderTechNews(container, cached.data);
            if (isCacheFresh(cached)) return;
        }

        const feeds = [
            'https://techcrunch.com/feed/',
            'https://feeds.arstechnica.com/arstechnica/index'
        ];

        const results = await Promise.all(feeds.map(function(url) {
            return fetchRss2jsonJSONP(url).then(function(items) {
                if (!items) return [];
                return items.map(function(item) {
                    // Determine source from URL
                    let source = 'Tech';
                    if (url.indexOf('techcrunch') !== -1) source = 'TechCrunch';
                    else if (url.indexOf('arstechnica') !== -1) source = 'Ars Technica';
                    item.source = source;
                    return item;
                });
            });
        }));

        const techData = results.filter(function(r) { return r.length > 0; });
        if (techData.length > 0) {
            setCache(TECH_NEWS_CACHE_KEY, techData);
        }
        renderTechNews(container, techData);
    }

})();
