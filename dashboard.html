<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1f9a0;</text></svg>">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --border: #e5e5ea;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #1d1d1f;
            --accent-light: #f5f5f7;
            --red: #ff3b30;
            --green: #34c759;
            --radius: 16px;
            --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.03);
            --shadow-hover: 0 2px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #aeaeb2; }

        /* -- Login -- */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box {
            width: 100%;
            max-width: 340px;
        }

        .login-box h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--card);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 0.75rem;
        }

        .login-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(29,29,31,0.08);
        }

        .login-box button {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .login-box button:hover { opacity: 0.85; }
        .login-box button:active { transform: scale(0.98); }

        .login-error {
            color: var(--red);
            font-size: 0.8rem;
            text-align: center;
            margin-top: 1rem;
            min-height: 1.2em;
        }

        /* -- Dashboard -- */
        .dashboard {
            display: none;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 2.5rem;
            animation: fadeIn 0.5s ease;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .dash-greeting h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }

        .dash-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .dash-header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-link {
            text-decoration: none;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: color 0.15s;
            font-weight: 500;
        }

        .btn-link:hover { color: var(--text); }

        .btn-logout {
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.45rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-logout:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .storage-warning {
            background: #fffbeb;
            border: 1px solid #fbbf24;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
            color: #92400e;
            display: none;
        }

        /* -- Grid -- */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-auto-rows: minmax(0, auto);
            gap: 1.25rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: box-shadow 0.25s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card-title {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
        }

        /* -- Card layout positions -- */
        .card-news { grid-column: 1; grid-row: 1 / 3; overflow-y: auto; }
        .card-weather { grid-column: 2; }
        .card-calendar { grid-column: 3; }
        .card-todos { grid-column: 2; }
        .card-notes { grid-column: 3; }

        /* -- Weather -- */
        .weather-main {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .weather-temp {
            font-size: 3rem;
            font-weight: 200;
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .weather-icon { font-size: 2.2rem; }

        .weather-desc {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .weather-details {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .weather-loading {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* -- Calendar -- */
        .cal-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .cal-nav-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.15s;
        }

        .cal-nav-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .cal-month-title {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            text-align: center;
            font-size: 0.78rem;
        }

        .cal-header {
            color: var(--text-secondary);
            font-weight: 600;
            padding: 0.4rem 0;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .cal-day {
            padding: 0.4rem 0;
            border-radius: 8px;
            cursor: default;
            position: relative;
            transition: background 0.15s;
        }

        .cal-day.today {
            background: var(--accent);
            color: #fff;
            font-weight: 700;
        }

        .cal-day.other-month { color: #d1d1d6; }

        .cal-day.holiday { color: var(--red); font-weight: 600; }
        .cal-day.holiday.today { background: var(--red); color: #fff; }

        .cal-day .holiday-dot {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--red);
        }

        .cal-day.today .holiday-dot { background: rgba(255,255,255,0.8); }

        .cal-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 4px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: #fff;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.65rem;
            white-space: nowrap;
            z-index: 20;
            pointer-events: none;
        }

        .cal-day:hover .cal-tooltip { display: block; }

        .cal-legend {
            margin-top: 0.75rem;
            padding-top: 0.65rem;
            border-top: 1px solid var(--border);
            font-size: 0.65rem;
            color: var(--text-secondary);
            max-height: 85px;
            overflow-y: auto;
        }

        .cal-legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.2rem 0;
        }

        .cal-legend-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--red);
            flex-shrink: 0;
        }

        /* -- Todos -- */
        .todo-input-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .todo-input-row input {
            flex: 1;
            padding: 0.55rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            background: var(--accent-light);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .todo-input-row input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(29,29,31,0.06);
        }

        .todo-input-row button {
            padding: 0.55rem 0.85rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }

        .todo-input-row button:hover { opacity: 0.85; }
        .todo-input-row button:active { transform: scale(0.96); }

        .todo-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
        }

        .todo-empty {
            font-size: 0.8rem;
            color: #d1d1d6;
            text-align: center;
            padding: 2.5rem 0;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.55rem 0;
            border-bottom: 1px solid #f2f2f7;
            font-size: 0.85rem;
        }

        .todo-item:last-child { border-bottom: none; }

        .todo-item input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #d1d1d6;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: all 0.2s;
        }

        .todo-item input[type="checkbox"]:checked {
            background: var(--green);
            border-color: var(--green);
        }

        .todo-item input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 5px;
            width: 4px;
            height: 7px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .todo-item.done .todo-text {
            text-decoration: line-through;
            color: #aeaeb2;
        }

        .todo-text {
            flex: 1;
            line-height: 1.4;
        }

        .todo-delete {
            background: none;
            border: none;
            color: #d1d1d6;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 0.25rem;
            transition: color 0.15s;
            line-height: 1;
        }

        .todo-delete:hover { color: var(--red); }

        /* -- Notes (Quill) -- */
        .notes-wrap {
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: var(--accent-light);
        }

        .notes-wrap .ql-toolbar {
            border: none;
            border-bottom: 1px solid var(--border);
            background: var(--card);
            padding: 0.35rem 0.5rem;
        }

        .notes-wrap .ql-toolbar .ql-formats { margin-right: 8px; }

        .notes-wrap .ql-container {
            border: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
            font-size: 0.85rem;
        }

        .notes-wrap .ql-editor {
            min-height: 150px;
            max-height: 240px;
            overflow-y: auto;
            line-height: 1.65;
            padding: 0.75rem 1rem;
        }

        .notes-wrap .ql-editor.ql-blank::before {
            font-style: normal;
            color: #c7c7cc;
        }

        .notes-status {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.5rem;
            font-size: 0.7rem;
            color: #aeaeb2;
            min-height: 1em;
        }

        .notes-status.error { color: var(--red); }

        /* -- News -- */
        .news-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 1.25rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .news-tab {
            flex: 1;
            padding: 0.5rem 0;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: var(--accent-light);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            text-align: center;
        }

        .news-tab:not(:last-child) { border-right: 1px solid var(--border); }

        .news-tab.active {
            background: var(--accent);
            color: #fff;
        }

        .news-tab:not(.active):hover {
            background: #eee;
        }

        .news-list {
            list-style: none;
            padding: 0;
        }

        .news-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid #f2f2f7;
        }

        .news-item:last-child { border-bottom: none; }

        .news-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.45;
            margin-bottom: 0.25rem;
            text-decoration: none;
            display: block;
            transition: color 0.15s;
        }

        .news-title:hover { color: var(--text-secondary); }
        .news-title:visited { color: #636366; }

        .news-desc {
            font-size: 0.75rem;
            color: #636366;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-meta {
            display: flex;
            gap: 0.4rem;
            align-items: center;
            margin-top: 0.35rem;
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        .news-source-tag {
            background: #f2f2f7;
            padding: 0.1rem 0.45rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .news-section-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid #f2f2f7;
        }

        .news-section-label:first-child { margin-top: 0; }

        .news-loading {
            font-size: 0.8rem;
            color: var(--text-secondary);
            padding: 1rem 0;
        }

        /* -- Responsive -- */
        @media (max-width: 960px) {
            .dashboard { padding: 1.5rem; }
            .grid {
                grid-template-columns: 1fr 1fr;
            }
            .card-news { grid-column: 1 / 3; grid-row: auto; max-height: 450px; }
            .card-weather { grid-column: 1; grid-row: auto; }
            .card-calendar { grid-column: 2; grid-row: auto; }
            .card-todos { grid-column: 1; grid-row: auto; }
            .card-notes { grid-column: 2; grid-row: auto; }
        }

        @media (max-width: 600px) {
            .dashboard { padding: 1rem; }
            .grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .card-news,
            .card-weather,
            .card-calendar,
            .card-todos,
            .card-notes {
                grid-column: 1;
                grid-row: auto;
            }
            .card-news { max-height: 380px; }
            .dash-header {
                flex-direction: column;
                gap: 0.75rem;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

<!-- Login -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h1>Dashboard</h1>
        <form id="loginForm">
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" autofocus>
            <button type="submit">Sign in</button>
        </form>
        <p class="login-error" id="loginError"></p>
    </div>
</div>

<!-- Dashboard (rendered by JS after auth) -->
<div class="dashboard" id="dashboard"></div>

<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script>
(function() {
    'use strict';

    // -- Constants --
    const PASS_HASH = 'd88a1030fc943736069d7cb44a01a031a263cacb0ab7cfa7b28eb7d54653bb44';
    const KEYS = {
        session: 'dash_session',
        todos: 'dash_todos',
        notes: 'dash_notes',
        weatherCache: 'dash_weather_cache',
        newsCache: 'dash_news_cache',
        techCache: 'dash_tech_cache'
    };
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_MS = 60000;
    const CACHE_TTL = 10 * 60 * 1000;

    // ===================================================
    // STORAGE: IndexedDB primary + localStorage fallback
    // ===================================================
    const DB_NAME = 'dash_store';
    const DB_VERSION = 1;
    const DB_STORE = 'kv';

    const IDB = {
        _db: null,
        _ready: null,

        init: function() {
            if (this._ready) return this._ready;
            this._ready = new Promise(function(resolve, reject) {
                if (!window.indexedDB) return reject(new Error('no idb'));
                var req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains(DB_STORE)) {
                        db.createObjectStore(DB_STORE);
                    }
                };
                req.onsuccess = function(e) {
                    IDB._db = e.target.result;
                    resolve(IDB._db);
                };
                req.onerror = function() { reject(req.error); };
            });
            return this._ready;
        },

        get: function(key) {
            return this.init().then(function(db) {
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(DB_STORE, 'readonly');
                    var req = tx.objectStore(DB_STORE).get(key);
                    req.onsuccess = function() { resolve(req.result); };
                    req.onerror = function() { reject(req.error); };
                });
            });
        },

        set: function(key, value) {
            return this.init().then(function(db) {
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(DB_STORE, 'readwrite');
                    tx.objectStore(DB_STORE).put(value, key);
                    tx.oncomplete = function() { resolve(true); };
                    tx.onerror = function() { reject(tx.error); };
                });
            });
        },

        remove: function(key) {
            return this.init().then(function(db) {
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(DB_STORE, 'readwrite');
                    tx.objectStore(DB_STORE).delete(key);
                    tx.oncomplete = function() { resolve(); };
                    tx.onerror = function() { reject(tx.error); };
                });
            });
        }
    };

    // Dual-write storage: writes to both IDB + localStorage for redundancy
    // Reads: IDB first, falls back to localStorage
    const Store = {
        _idbOk: true,

        save: function(key, value) {
            // Sync write to localStorage (always, as backup)
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                console.warn('localStorage write failed:', key, e);
            }
            // Async write to IndexedDB (primary)
            return IDB.set(key, value).catch(function(e) {
                Store._idbOk = false;
                console.warn('IDB write failed:', key, e);
            });
        },

        load: function(key, fallback) {
            var fb = fallback !== undefined ? fallback : null;
            // Try IndexedDB first
            return IDB.get(key).then(function(val) {
                if (val !== undefined && val !== null) return val;
                // Fall back to localStorage
                return Store._readLS(key, fb);
            }).catch(function() {
                Store._idbOk = false;
                return Store._readLS(key, fb);
            });
        },

        remove: function(key) {
            try { localStorage.removeItem(key); } catch(e) {}
            return IDB.remove(key).catch(function() {});
        },

        // Synchronous localStorage read (for fallback and beforeunload)
        _readLS: function(key, fallback) {
            try {
                var raw = localStorage.getItem(key);
                if (raw === null) return fallback;
                return JSON.parse(raw);
            } catch (e) {
                return fallback;
            }
        },

        // Synchronous save to localStorage only (for beforeunload)
        saveSync: function(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {}
        },

        // Migrate: if IDB is empty but localStorage has data, copy to IDB
        migrate: function(key) {
            return IDB.get(key).then(function(val) {
                if (val !== undefined && val !== null) return val;
                var lsVal = Store._readLS(key, null);
                if (lsVal !== null) {
                    return IDB.set(key, lsVal).then(function() { return lsVal; }).catch(function() { return lsVal; });
                }
                return null;
            }).catch(function() {
                return Store._readLS(key, null);
            });
        }
    };

    // Request persistent storage
    if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(function() {});
    }

    // Initialize IDB early

    // -- Auth helpers --
    async function hashPassword(pw) {
        var data = new TextEncoder().encode(pw);
        var buf = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    }

    function isLoggedIn() {
        try { return localStorage.getItem(KEYS.session) === 'true'; } catch(e) { return false; }
    }

    function setLoggedIn(val) {
        try {
            if (val) localStorage.setItem(KEYS.session, 'true');
            else localStorage.removeItem(KEYS.session);
        } catch(e) {}
        if (val) IDB.set(KEYS.session, true).catch(function(){});
        else IDB.remove(KEYS.session).catch(function(){});
    }

    function isLockedOut() {
        var lockUntil = parseInt(sessionStorage.getItem('dash_lockout') || '0');
        if (Date.now() < lockUntil) return true;
        if (lockUntil > 0) {
            sessionStorage.removeItem('dash_lockout');
            sessionStorage.removeItem('dash_attempts');
        }
        return false;
    }

    function getAttempts() { return parseInt(sessionStorage.getItem('dash_attempts') || '0'); }

    function recordFailedAttempt() {
        var a = getAttempts() + 1;
        sessionStorage.setItem('dash_attempts', String(a));
        if (a >= MAX_ATTEMPTS) sessionStorage.setItem('dash_lockout', String(Date.now() + LOCKOUT_MS));
        return a;
    }

    // -- Cache helpers --
    function getCacheSync(key) {
        var c = Store._readLS(key, null);
        if (c && c.data && c.ts) return c;
        return null;
    }

    function setCache(key, data) {
        Store.save(key, { data: data, ts: Date.now() });
    }

    function isFresh(cached) {
        return cached && (Date.now() - cached.ts) < CACHE_TTL;
    }

    // -- Swiss/Bern Holidays --
    function computeEaster(year) {
        var a = year % 19;
        var b = Math.floor(year / 100), c = year % 100;
        var d = Math.floor(b / 4), e = b % 4;
        var f = Math.floor((b + 8) / 25);
        var g = Math.floor((b - f + 1) / 3);
        var h = (19 * a + b - d - g + 15) % 30;
        var i = Math.floor(c / 4), k = c % 4;
        var l = (32 + 2 * e + 2 * i - h - k) % 7;
        var m = Math.floor((a + 11 * h + 22 * l) / 451);
        var month = Math.floor((h + l - 7 * m + 114) / 31) - 1;
        var day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month, day);
    }

    function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }

    function dateKey(d) {
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function getBernHolidays(year) {
        var easter = computeEaster(year);
        var h = {};
        var add = function(d, name) { h[dateKey(d)] = name; };
        add(new Date(year, 0, 1), 'Neujahr');
        add(new Date(year, 0, 2), 'Berchtoldstag');
        add(addDays(easter, -2), 'Karfreitag');
        add(easter, 'Ostersonntag');
        add(addDays(easter, 1), 'Ostermontag');
        add(addDays(easter, 39), 'Auffahrt');
        add(addDays(easter, 49), 'Pfingstsonntag');
        add(addDays(easter, 50), 'Pfingstmontag');
        add(new Date(year, 7, 1), 'Bundesfeiertag');
        add(new Date(year, 11, 25), 'Weihnachten');
        add(new Date(year, 11, 26), 'Stephanstag');
        return h;
    }

    // -- Calendar --
    var calYear, calMonth;

    function initCalendar() {
        var now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth();
        renderCalendar();

        document.getElementById('calPrev').addEventListener('click', function() {
            calMonth--;
            if (calMonth < 0) { calMonth = 11; calYear--; }
            renderCalendar();
        });
        document.getElementById('calNext').addEventListener('click', function() {
            calMonth++;
            if (calMonth > 11) { calMonth = 0; calYear++; }
            renderCalendar();
        });
    }

    function renderCalendar() {
        var now = new Date();
        var isCurrent = calYear === now.getFullYear() && calMonth === now.getMonth();
        var today = isCurrent ? now.getDate() : -1;
        var holidays = getBernHolidays(calYear);

        document.getElementById('calTitle').textContent = new Date(calYear, calMonth, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        var grid = document.getElementById('calGrid');
        grid.innerHTML = '';

        ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(function(d) {
            var el = document.createElement('div');
            el.className = 'cal-header';
            el.textContent = d;
            grid.appendChild(el);
        });

        var first = new Date(calYear, calMonth, 1);
        var startDay = first.getDay() - 1;
        if (startDay < 0) startDay = 6;
        var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        var prevDays = new Date(calYear, calMonth, 0).getDate();

        for (var i = startDay - 1; i >= 0; i--) {
            var el = document.createElement('div');
            el.className = 'cal-day other-month';
            el.textContent = prevDays - i;
            grid.appendChild(el);
        }

        var monthHolidays = [];
        for (var d = 1; d <= daysInMonth; d++) {
            var el = document.createElement('div');
            var dk = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
            var hName = holidays[dk];
            var cls = 'cal-day';
            if (d === today) cls += ' today';
            if (hName) cls += ' holiday';
            el.className = cls;
            el.textContent = d;

            if (hName) {
                var dot = document.createElement('span');
                dot.className = 'holiday-dot';
                el.appendChild(dot);
                var tip = document.createElement('span');
                tip.className = 'cal-tooltip';
                tip.textContent = hName;
                el.appendChild(tip);
                monthHolidays.push({ day: d, name: hName });
            }
            grid.appendChild(el);
        }

        var rem = (7 - ((startDay + daysInMonth) % 7)) % 7;
        for (var j = 1; j <= rem; j++) {
            var el = document.createElement('div');
            el.className = 'cal-day other-month';
            el.textContent = j;
            grid.appendChild(el);
        }

        var legend = document.getElementById('calLegend');
        legend.innerHTML = '';
        monthHolidays.forEach(function(h) {
            var item = document.createElement('div');
            item.className = 'cal-legend-item';
            item.innerHTML = '<span class="cal-legend-dot"></span><span>' + h.day + '. ' + h.name + '</span>';
            legend.appendChild(item);
        });
    }

    function saveTodos() {
        Store.save(KEYS.todos, _todosCache);
    }

    function renderTodos() {
        var list = document.getElementById('todoList');
        list.innerHTML = '';
        if (_todosCache.length === 0) {
            list.innerHTML = '<li class="todo-empty">No tasks yet</li>';
            return;
        }
        _todosCache.forEach(function(todo, i) {
            var li = document.createElement('li');
            li.className = 'todo-item' + (todo.done ? ' done' : '');

            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = todo.done;
            cb.addEventListener('change', function() {
                _todosCache[i].done = !_todosCache[i].done;
                saveTodos();
                renderTodos();
            });

            var span = document.createElement('span');
            span.className = 'todo-text';
            span.textContent = todo.text;

            var del = document.createElement('button');
            del.className = 'todo-delete';
            del.innerHTML = '&#215;';
            del.addEventListener('click', function() {
                _todosCache.splice(i, 1);
                saveTodos();
                renderTodos();
            });

            li.append(cb, span, del);
            list.appendChild(li);
        });
    }

    function addTodo(text) {
        if (!text.trim()) return;
        _todosCache.push({ text: text.trim(), done: false });
        saveTodos();
        renderTodos();

    function weatherIcon(c) {
        if (c === 0) return '\u2600\ufe0f';
        if (c <= 3) return '\u26c5';
        if (c <= 48) return '\u2601\ufe0f';
        if (c <= 67) return '\ud83c\udf27\ufe0f';
        if (c <= 77) return '\ud83c\udf28\ufe0f';
        if (c <= 86) return '\ud83c\udf28\ufe0f';
        if (c <= 99) return '\u26c8\ufe0f';
        return '\ud83c\udf24\ufe0f';
    }

    function weatherDesc(c) {
        if (c === 0) return 'Clear sky';
        if (c <= 3) return 'Partly cloudy';
        if (c <= 48) return 'Foggy';
        if (c <= 57) return 'Drizzle';
        if (c <= 67) return 'Rain';
        if (c <= 77) return 'Snow';
        if (c <= 82) return 'Rain showers';
        if (c <= 86) return 'Snow showers';
        if (c <= 99) return 'Thunderstorm';
        return 'Unknown';
    }

    // -- News --
    function stripHTML(html) {
        var d = document.createElement('div');
        d.innerHTML = html;
        return d.textContent || d.innerText || '';
    }

    function timeAgo(dateStr) {
        var date = new Date(dateStr);
        if (isNaN(date)) return '';
        var mins = Math.floor((Date.now() - date.getTime()) / 60000);
        if (mins < 60) return mins + 'm';
        var hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + 'h';
        return Math.floor(hrs / 24) + 'd';
    }

    function renderItems(container, items, max) {
        var ul = document.createElement('ul');
        ul.className = 'news-list';
        items.slice(0, max).forEach(function(item) {

            a.href = item.link || '#';
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = item.title;
            li.appendChild(a);

            var desc = stripHTML(item.desc || '').trim();
            if (desc && desc !== item.title) {
                var p = document.createElement('div');
                p.className = 'news-desc';
                p.textContent = desc;
                li.appendChild(p);
            }

            var meta = document.createElement('div');
            meta.className = 'news-meta';
            if (item.source) {
                var tag = document.createElement('span');
                tag.className = 'news-source-tag';
                tag.textContent = item.source;
                meta.appendChild(tag);
            }
            if (item.pubDate) {
                var t = document.createElement('span');
                t.textContent = timeAgo(item.pubDate);
                meta.appendChild(t);
            }
            li.appendChild(meta);
            ul.appendChild(li);
        });
        container.appendChild(ul);
    }

    // JSONP
    function jsonp(url) {
        return new Promise(function(resolve, reject) {
            var cb = '_jp_' + Math.random().toString(36).slice(2);
            var timer = setTimeout(function() {
                delete window[cb]; cleanup(); reject(new Error('timeout'));
            }, 12000);
            var script = document.createElement('script');
            var cleanup = function() { if (script.parentNode) script.parentNode.removeChild(script); };
            window[cb] = function(data) { clearTimeout(timer); delete window[cb]; cleanup(); resolve(data); };
            script.src = url + '&callback=' + cb;
            script.onerror = function() { clearTimeout(timer); delete window[cb]; cleanup(); reject(new Error('err')); };
            document.head.appendChild(script);
        });
    }

    async function fetchFeed(rssUrl) {
        try {
            var data = await jsonp('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl));
            if (data.status !== 'ok' || !data.items) return null;
            return data.items.map(function(i) {
                return { title: i.title || '', link: i.link || '#', pubDate: i.pubDate || '', desc: i.description || '', source: i.author || '' };
            });
        } catch (e) { return null; }
    }

        document.querySelectorAll('.news-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {

    async function loadNews() {
        var mainEl = document.getElementById('newsContent');
        var regEl = document.getElementById('newsRegional');

        var cached = getCacheSync(KEYS.newsCache);
        if (cached && cached.data) {
            renderNewsSections(mainEl, regEl, cached.data);
            if (isFresh(cached)) return;
        }

        var results = await Promise.all([
            fetchFeed('https://www.nzz.ch/recent.rss'),
            fetchFeed('https://www.nzz.ch/zuerich.rss')
        ]);

        var newsData = { main: results[0] || [], regional: results[1] || [] };
        if (results[0] || results[1]) setCache(KEYS.newsCache, newsData);
        renderNewsSections(mainEl, regEl, newsData);
    }

    function renderNewsSections(mainEl, regEl, data) {
        mainEl.innerHTML = '';
        if (data.main && data.main.length > 0) {
            var label = document.createElement('div');
            label.className = 'news-section-label';
            label.textContent = 'Aktuell';
            mainEl.appendChild(label);
            renderItems(mainEl, data.main, 8);
        } else {
            mainEl.innerHTML = '<p class="news-loading">Unable to load news</p>';
        }

        regEl.innerHTML = '';
        if (data.regional && data.regional.length > 0) {
            var label = document.createElement('div');
            label.className = 'news-section-label';
            label.textContent = 'Regional';
            regEl.appendChild(label);
            renderItems(regEl, data.regional, 5);
        }
    }

    async function loadTechNews() {
        var el = document.getElementById('techContent');

        var cached = getCacheSync(KEYS.techCache);
        if (cached && cached.data) {
            renderTechNews(el, cached.data);
            if (isFresh(cached)) return;
        }

        var feeds = [
            { url: 'https://techcrunch.com/feed/', name: 'TechCrunch' },
            { url: 'https://feeds.arstechnica.com/arstechnica/index', name: 'Ars Technica' }
        ];

        var results = await Promise.all(feeds.map(function(f) {
            return fetchFeed(f.url).then(function(items) {
                if (!items) return [];
                return items.map(function(item) { item.source = f.name; return item; });
            });
        }));

        var allItems = results.flat().sort(function(a, b) { return new Date(b.pubDate) - new Date(a.pubDate); });
        if (allItems.length > 0) setCache(KEYS.techCache, allItems);
        renderTechNews(el, allItems);
    }

    function renderTechNews(el, items) {
        el.innerHTML = '';
        if (!items || items.length === 0) {
            el.innerHTML = '<p class="news-loading">Unable to load tech news</p>';
            return;
        }
        renderItems(el, items, 12);
    }

})();
</script>
