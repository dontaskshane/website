<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1f9a0;</text></svg>">
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --border: #e5e5ea;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #1d1d1f;
            --accent-light: #f5f5f7;
            --red: #ff3b30;
            --green: #34c759;
            --radius: 16px;
            --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.03);
            --shadow-hover: 0 2px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #aeaeb2; }

        /* -- Login -- */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box { width: 100%; max-width: 340px; }

        .login-box h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--card);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 0.75rem;
        }

        .login-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(29,29,31,0.08);
        }

        .login-box button {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .login-box button:hover { opacity: 0.85; }
        .login-box button:active { transform: scale(0.98); }

        .login-error {
            color: var(--red);
            font-size: 0.8rem;
            text-align: center;
            margin-top: 1rem;
            min-height: 1.2em;
        }

        /* -- Dashboard -- */
        .dashboard {
            display: none;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 2.5rem;
            animation: fadeIn 0.5s ease;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.75rem;
        }

        .dash-greeting h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.2rem;
        }

        .dash-date {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .dash-header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-link {
            text-decoration: none;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: color 0.15s;
            font-weight: 500;
        }

        .btn-link:hover { color: var(--text); }

        .btn-logout {
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.4rem 0.9rem;
            font-size: 0.78rem;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-logout:hover { border-color: var(--accent); color: var(--text); }

        .storage-warning {
            background: #fffbeb;
            border: 1px solid #fbbf24;
            border-radius: 10px;
            padding: 0.6rem 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.78rem;
            color: #92400e;
            display: none;
        }

        /* -- Grid -- */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-auto-rows: auto;
            gap: 1.25rem;
            align-items: start;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: box-shadow 0.25s ease;
        }

        .card:hover { box-shadow: var(--shadow-hover); }

        .card-title {
            font-size: 0.62rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title-row .card-title { margin-bottom: 0; }

        /* -- Card positions -- */
        .card-news { grid-column: 1; grid-row: 1 / 3; overflow-y: auto; }
        .card-weather { grid-column: 2; }
        .card-calendar { grid-column: 3; }
        .card-todos { grid-column: 2; }
        .card-notes { grid-column: 3; grid-row: 2 / 4; }

        /* -- Weather -- */
        .weather-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .weather-icon { font-size: 2rem; line-height: 1; }

        .weather-temp {
            font-size: 2.5rem;
            font-weight: 200;
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .weather-info { flex: 1; }

        .weather-desc {
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 0.15rem;
        }

        .weather-details {
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .weather-loading {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* -- Calendar -- */
        .cal-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .cal-nav-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.15s;
        }

        .cal-nav-btn:hover { border-color: var(--accent); color: var(--text); }

        .cal-nav-center {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cal-month-title {
            font-size: 0.82rem;
            font-weight: 600;
        }

        .cal-today-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.15rem 0.4rem;
            font-size: 0.6rem;
            font-weight: 600;
            font-family: inherit;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .cal-today-btn:hover { border-color: var(--accent); color: var(--text); }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 0.75rem;
        }

        .cal-header {
            color: var(--text-secondary);
            font-weight: 600;
            padding: 0.35rem 0;
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .cal-header.weekend { color: #c7c7cc; }

        .cal-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: default;
            position: relative;
            font-variant-numeric: tabular-nums;
        }

        .cal-day.today {
            background: var(--accent);
            color: #fff;
            font-weight: 700;
        }

        .cal-day.other-month { color: #d1d1d6; }
        .cal-day.weekend:not(.today):not(.other-month) { color: #aeaeb2; }

        .cal-day.holiday:not(.today) { color: var(--red); font-weight: 600; }
        .cal-day.holiday.today { background: var(--red); color: #fff; }

        .cal-day .h-dot {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--red);
        }

        .cal-day.today .h-dot { background: rgba(255,255,255,0.8); }

        .cal-tip {
            display: none;
            position: absolute;
            bottom: calc(100% + 4px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: #fff;
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
            font-size: 0.6rem;
            white-space: nowrap;
            z-index: 20;
            pointer-events: none;
        }

        .cal-day:hover .cal-tip { display: block; }

        .cal-legend {
            margin-top: 0.6rem;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.62rem;
            color: var(--text-secondary);
            max-height: 70px;
            overflow-y: auto;
        }

        .cal-legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.15rem 0;
        }

        .cal-legend-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--red);
            flex-shrink: 0;
        }

        /* -- Todos -- */
        .todo-input-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .todo-input-row input {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.82rem;
            font-family: inherit;
            outline: none;
            background: var(--accent-light);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .todo-input-row input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(29,29,31,0.06);
        }

        .todo-input-row button {
            padding: 0.5rem 0.75rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }

        .todo-input-row button:hover { opacity: 0.85; }
        .todo-input-row button:active { transform: scale(0.96); }

        .todo-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .todo-empty {
            font-size: 0.78rem;
            color: #d1d1d6;
            text-align: center;
            padding: 1.5rem 0;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 0;
            border-bottom: 1px solid #f2f2f7;
            font-size: 0.82rem;
        }

        .todo-item:last-child { border-bottom: none; }

        .todo-item input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid #d1d1d6;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: all 0.2s;
        }

        .todo-item input[type="checkbox"]:checked {
            background: var(--green);
            border-color: var(--green);
        }

        .todo-item input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 4px;
            width: 4px;
            height: 7px;
            border: solid #fff;
            border-width: 0 1.5px 1.5px 0;
            transform: rotate(45deg);
        }

        .todo-item.done .todo-text {
            text-decoration: line-through;
            color: #aeaeb2;
        }

        .todo-text { flex: 1; line-height: 1.4; }

        .todo-delete {
            background: none;
            border: none;
            color: #d1d1d6;
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            transition: color 0.15s;
            line-height: 1;
        }

        .todo-delete:hover { color: var(--red); }

        /* -- Sticky Notes -- */
        .sticky-add-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.15s;
            line-height: 1;
        }

        .sticky-add-btn:hover { border-color: var(--accent); color: var(--text); }

        .sticky-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            max-height: 420px;
            overflow-y: auto;
        }

        .sticky-empty {
            grid-column: 1 / 3;
            font-size: 0.78rem;
            color: #d1d1d6;
            text-align: center;
            padding: 2rem 0;
        }

        .sticky-note {
            border-radius: 10px;
            padding: 0.6rem 0.7rem;
            position: relative;
            min-height: 80px;
            display: flex;
            flex-direction: column;
        }

        .sticky-note[data-color="0"] { background: #fef9e7; border: 1px solid #f7dc6f; }
        .sticky-note[data-color="1"] { background: #eaf2f8; border: 1px solid #aed6f1; }
        .sticky-note[data-color="2"] { background: #eafaf1; border: 1px solid #a9dfbf; }
        .sticky-note[data-color="3"] { background: #fdf2f8; border: 1px solid #f0abfc; }
        .sticky-note[data-color="4"] { background: #f5f3ff; border: 1px solid #c4b5fd; }
        .sticky-note[data-color="5"] { background: #fff7ed; border: 1px solid #fdba74; }

        .sticky-body {
            flex: 1;
            font-size: 0.78rem;
            line-height: 1.5;
            outline: none;
            word-break: break-word;
            min-height: 50px;
        }

        .sticky-body:empty::before {
            content: 'Type here...';
            color: #b0b0b0;
        }

        .sticky-delete {
            position: absolute;
            top: 4px;
            right: 6px;
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 0.85rem;
            line-height: 1;
            padding: 2px;
            transition: color 0.15s;
            opacity: 0;
        }

        .sticky-note:hover .sticky-delete { opacity: 1; }
        .sticky-delete:hover { color: var(--red); }

        .sticky-format-bar {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 0.6rem;
        }

        .sticky-fmt-btn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            width: 24px;
            height: 24px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-family: inherit;
            transition: all 0.15s;
        }

        .sticky-fmt-btn:hover { border-color: var(--accent); color: var(--text); }

        .notes-status {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.4rem;
            font-size: 0.65rem;
            color: #aeaeb2;
            min-height: 1em;
        }

        .notes-status.error { color: var(--red); }

        /* -- News -- */
        .news-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .news-tab {
            flex: 1;
            padding: 0.45rem 0;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: var(--accent-light);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            text-align: center;
        }

        .news-tab:not(:last-child) { border-right: 1px solid var(--border); }
        .news-tab.active { background: var(--accent); color: #fff; }
        .news-tab:not(.active):hover { background: #eee; }

        .news-list { list-style: none; padding: 0; }

        .news-item {
            padding: 0.6rem 0;
            border-bottom: 1px solid #f2f2f7;
        }

        .news-item:last-child { border-bottom: none; }

        .news-title {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.4;
            margin-bottom: 0.2rem;
            text-decoration: none;
            display: block;
            transition: color 0.15s;
        }

        .news-title:hover { color: var(--text-secondary); }
        .news-title:visited { color: #636366; }

        .news-desc {
            font-size: 0.72rem;
            color: #636366;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-meta {
            display: flex;
            gap: 0.35rem;
            align-items: center;
            margin-top: 0.25rem;
            font-size: 0.6rem;
            color: var(--text-secondary);
        }

        .news-source-tag {
            background: #f2f2f7;
            padding: 0.08rem 0.4rem;
            border-radius: 3px;
            font-weight: 600;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .news-section-label {
            font-size: 0.58rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-top: 1rem;
            margin-bottom: 0.4rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid #f2f2f7;
        }

        .news-section-label:first-child { margin-top: 0; }

        .news-loading {
            font-size: 0.78rem;
            color: var(--text-secondary);
            padding: 0.75rem 0;
        }

        /* -- Responsive -- */
        @media (max-width: 960px) {
            .dashboard { padding: 1.5rem; }
            .grid { grid-template-columns: 1fr 1fr; }
            .card-news { grid-column: 1 / 3; grid-row: auto; max-height: 400px; }
            .card-weather, .card-calendar, .card-todos, .card-notes {
                grid-column: auto; grid-row: auto;
            }
            .card-notes { grid-row: auto; }
        }

        @media (max-width: 600px) {
            .dashboard { padding: 1rem; }
            .grid { grid-template-columns: 1fr; gap: 1rem; }
            .card-news, .card-weather, .card-calendar, .card-todos, .card-notes {
                grid-column: 1; grid-row: auto;
            }
            .card-news { max-height: 350px; }
            .sticky-grid { grid-template-columns: 1fr; }
            .dash-header {
                flex-direction: column;
                gap: 0.75rem;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h1>Dashboard</h1>
        <form id="loginForm">
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" autofocus>
            <button type="submit">Sign in</button>
        </form>
        <p class="login-error" id="loginError"></p>
    </div>
</div>

<div class="dashboard" id="dashboard"></div>

<script>
(function() {
    'use strict';

    var PASS_HASH = 'd88a1030fc943736069d7cb44a01a031a263cacb0ab7cfa7b28eb7d54653bb44';
    var KEYS = {
        session: 'dash_session',
        todos: 'dash_todos',
        notes: 'dash_notes',
        weatherCache: 'dash_weather_cache',
        newsCache: 'dash_news_cache',
        techCache: 'dash_tech_cache'
    };
    var MAX_ATTEMPTS = 5;
    var LOCKOUT_MS = 60000;
    var CACHE_TTL = 10 * 60 * 1000;
    var NOTE_COLORS = 6;

    // ===== IndexedDB + localStorage dual storage =====
    var DB_NAME = 'dash_store';
    var DB_VERSION = 1;
    var DB_STORE = 'kv';

    var IDB = {
        _db: null,
        _ready: null,
        init: function() {
            if (this._ready) return this._ready;
            this._ready = new Promise(function(resolve, reject) {
                if (!window.indexedDB) return reject(new Error('no idb'));
                var req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
                };
                req.onsuccess = function(e) { IDB._db = e.target.result; resolve(IDB._db); };
                req.onerror = function() { reject(req.error); };
            });
            return this._ready;
        },
        get: function(key) {
            return this.init().then(function(db) {
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(DB_STORE, 'readonly');
                    var req = tx.objectStore(DB_STORE).get(key);
                    req.onsuccess = function() { resolve(req.result); };
                    req.onerror = function() { reject(req.error); };
                });
            });
        },
        set: function(key, value) {
            return this.init().then(function(db) {
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(DB_STORE, 'readwrite');
                    tx.objectStore(DB_STORE).put(value, key);
                    tx.oncomplete = function() { resolve(true); };
                    tx.onerror = function() { reject(tx.error); };
                });
            });
        },
        remove: function(key) {
            return this.init().then(function(db) {
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(DB_STORE, 'readwrite');
                    tx.objectStore(DB_STORE).delete(key);
                    tx.oncomplete = function() { resolve(); };
                    tx.onerror = function() { reject(tx.error); };
                });
            });
        }
    };

    var Store = {
        _idbOk: true,
        save: function(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
            return IDB.set(key, value).catch(function() { Store._idbOk = false; });
        },
        load: function(key, fb) {
            var fallback = fb !== undefined ? fb : null;
            return IDB.get(key).then(function(val) {
                if (val !== undefined && val !== null) return val;
                return Store._readLS(key, fallback);
            }).catch(function() {
                Store._idbOk = false;
                return Store._readLS(key, fallback);
            });
        },
        remove: function(key) {
            try { localStorage.removeItem(key); } catch(e) {}
            return IDB.remove(key).catch(function() {});
        },
        _readLS: function(key, fb) {
            try {
                var raw = localStorage.getItem(key);
                if (raw === null) return fb;
                return JSON.parse(raw);
            } catch(e) { return fb; }
        },
        saveSync: function(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
        },
        migrate: function(key) {
            return IDB.get(key).then(function(val) {
                if (val !== undefined && val !== null) return val;
                var ls = Store._readLS(key, null);
                if (ls !== null) return IDB.set(key, ls).then(function() { return ls; }).catch(function() { return ls; });
                return null;
            }).catch(function() { return Store._readLS(key, null); });
        }
    };

    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function() {});
    IDB.init().catch(function() { Store._idbOk = false; });

    // ===== Auth =====
    async function hashPassword(pw) {
        var data = new TextEncoder().encode(pw);
        var buf = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
    }

    function isLoggedIn() {
        try { return localStorage.getItem(KEYS.session) === 'true'; } catch(e) { return false; }
    }

    function setLoggedIn(v) {
        try {
            if (v) localStorage.setItem(KEYS.session, 'true');
            else localStorage.removeItem(KEYS.session);
        } catch(e) {}
        if (v) IDB.set(KEYS.session, true).catch(function(){});
        else IDB.remove(KEYS.session).catch(function(){});
    }

    function isLockedOut() {
        var until = parseInt(sessionStorage.getItem('dash_lockout') || '0');
        if (Date.now() < until) return true;
        if (until > 0) { sessionStorage.removeItem('dash_lockout'); sessionStorage.removeItem('dash_attempts'); }
        return false;
    }

    function getAttempts() { return parseInt(sessionStorage.getItem('dash_attempts') || '0'); }

    function recordFail() {
        var a = getAttempts() + 1;
        sessionStorage.setItem('dash_attempts', String(a));
        if (a >= MAX_ATTEMPTS) sessionStorage.setItem('dash_lockout', String(Date.now() + LOCKOUT_MS));
        return a;
    }

    // Cache
    function getCacheSync(key) {
        var c = Store._readLS(key, null);
        return (c && c.data && c.ts) ? c : null;
    }
    function setCache(key, data) { Store.save(key, { data: data, ts: Date.now() }); }
    function isFresh(c) { return c && (Date.now() - c.ts) < CACHE_TTL; }

    // ===== Holidays =====
    function computeEaster(y) {
        var a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4;
        var f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3);
        var h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4;
        var l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
        return new Date(y, Math.floor((h+l-7*m+114)/31)-1, ((h+l-7*m+114)%31)+1);
    }

    function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate()+n); return r; }
    function dk(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

    function getBernHolidays(year) {
        var e = computeEaster(year), h = {};
        var add = function(d,n) { h[dk(d)] = n; };
        add(new Date(year,0,1),'Neujahr');
        add(new Date(year,0,2),'Berchtoldstag');
        add(addDays(e,-2),'Karfreitag');
        add(e,'Ostersonntag');
        add(addDays(e,1),'Ostermontag');
        add(addDays(e,39),'Auffahrt');
        add(addDays(e,49),'Pfingstsonntag');
        add(addDays(e,50),'Pfingstmontag');
        add(new Date(year,7,1),'Bundesfeiertag');
        add(new Date(year,11,25),'Weihnachten');
        add(new Date(year,11,26),'Stephanstag');
        return h;
    }

        var errEl = document.getElementById('loginError');

        if (isLockedOut()) { errEl.textContent = 'Too many attempts. Try again in 1 minute.'; pwEl.value = ''; return; }

    // ===== Calendar =====
    var calYear, calMonth;

    function initCalendar() {
        var now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth();
        renderCalendar();
        document.getElementById('calPrev').addEventListener('click', function() {
            calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar();
        });
        document.getElementById('calNext').addEventListener('click', function() {
            calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar();
        });
        document.getElementById('calToday').addEventListener('click', function() {
            var now = new Date();
            calYear = now.getFullYear();
            calMonth = now.getMonth();
            renderCalendar();
        });
    }

    function renderCalendar() {
        var now = new Date();
        var isCur = calYear === now.getFullYear() && calMonth === now.getMonth();
        var today = isCur ? now.getDate() : -1;
        var holidays = getBernHolidays(calYear);

        document.getElementById('calTitle').textContent = new Date(calYear, calMonth, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        var grid = document.getElementById('calGrid');
        grid.innerHTML = '';

        ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(function(d, i) {
            var el = document.createElement('div');
            el.className = 'cal-header' + (i >= 5 ? ' weekend' : '');
            el.textContent = d;
            grid.appendChild(el);
        });

        var first = new Date(calYear, calMonth, 1);
        var startDay = first.getDay() - 1;
        if (startDay < 0) startDay = 6;
        var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        var prevDays = new Date(calYear, calMonth, 0).getDate();

        for (var i = startDay - 1; i >= 0; i--) {
            var el = document.createElement('div');
            el.className = 'cal-day other-month';
            el.textContent = prevDays - i;
            grid.appendChild(el);
        }

        var monthH = [];
        for (var d = 1; d <= daysInMonth; d++) {
            var el = document.createElement('div');
            var key = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
            var hName = holidays[key];
            var dayOfWeek = new Date(calYear, calMonth, d).getDay();
            var isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
            var cls = 'cal-day';
            if (d === today) cls += ' today';
            if (isWeekend) cls += ' weekend';
            if (hName) cls += ' holiday';
            el.className = cls;
            el.textContent = d;

            if (hName) {
                var dot = document.createElement('span');
                dot.className = 'h-dot';
                el.appendChild(dot);
                var tip = document.createElement('span');
                tip.className = 'cal-tip';
                tip.textContent = hName;
                el.appendChild(tip);
                monthH.push({ day: d, name: hName });
            }
            grid.appendChild(el);
        }

        var rem = (7 - ((startDay + daysInMonth) % 7)) % 7;
        for (var j = 1; j <= rem; j++) {
            var el = document.createElement('div');
            el.className = 'cal-day other-month';
            el.textContent = j;
            grid.appendChild(el);
        }

        var legend = document.getElementById('calLegend');
        legend.innerHTML = '';
        if (monthH.length > 0) {
            monthH.forEach(function(h) {
                var item = document.createElement('div');
                item.className = 'cal-legend-item';
                item.innerHTML = '<span class="cal-legend-dot"></span><span>' + h.day + '. ' + h.name + '</span>';
                legend.appendChild(item);
            });
        } else {
            legend.style.display = 'none';
        }
        if (monthH.length > 0) legend.style.display = '';
    }

    function renderTodos() {
        var list = document.getElementById('todoList');
        list.innerHTML = '';
        if (_todos.length === 0) {
            list.innerHTML = '<li class="todo-empty">No tasks yet</li>';
            return;
        }
        _todos.forEach(function(todo, i) {

            cb.type = 'checkbox'; cb.checked = todo.done;

            var span = document.createElement('span');

            list.appendChild(li);

    function addTodo(text) {
        if (!text.trim()) return;
        _todos.push({ text: text.trim(), done: false });
        saveTodos(); renderTodos();
    }

    // ===== Sticky Notes =====
    var _stickies = [];
    var _stickyTimer = null;

    function initStickyNotes() {
        // Format buttons
        document.querySelectorAll('.sticky-fmt-btn').forEach(function(btn) {
            btn.addEventListener('mousedown', function(e) {
                e.preventDefault(); // prevent stealing focus
                document.execCommand(btn.dataset.cmd, false, null);
            });
        });

        document.getElementById('stickyAdd').addEventListener('click', function() {
            addSticky();
        });

        // Load
        Store.migrate(KEYS.notes).then(function(data) {
            if (Array.isArray(data)) {
                _stickies = data;
            } else if (data && data.ops) {
                // Migrate from Quill Delta: extract plain text
                var text = '';
                data.ops.forEach(function(op) { if (typeof op.insert === 'string') text += op.insert; });
                if (text.trim()) {
                    _stickies = [{ id: genId(), html: text.trim().replace(/\n/g, '<br>'), color: 0 }];
                }
            } else if (typeof data === 'string' && data.trim()) {
                _stickies = [{ id: genId(), html: data.trim().replace(/\n/g, '<br>'), color: 0 }];
            } else {
                _stickies = [];
            }
            renderStickies();
        });
    }

    function genId() { return 'n_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    function addSticky() {
        _stickies.push({ id: genId(), html: '', color: _stickies.length % NOTE_COLORS });
        saveStickies();
        renderStickies();
        // Focus the new note
        var bodies = document.querySelectorAll('.sticky-body');
        if (bodies.length > 0) bodies[bodies.length - 1].focus();
    }

    function saveStickies() {
        Store.save(KEYS.notes, _stickies).then(function() {
            showNotesStatus('Saved', false);
        }).catch(function() {
            showNotesStatus('Save failed', true);
        });
    }

    function saveStickySync() {
        // Read current content from DOM before saving
        syncStickiesFromDOM();
        Store.saveSync(KEYS.notes, _stickies);
    }

    function syncStickiesFromDOM() {
        var notes = document.querySelectorAll('.sticky-note');
        notes.forEach(function(el) {
            var id = el.dataset.id;
            var body = el.querySelector('.sticky-body');
            if (body) {
                var s = _stickies.find(function(n) { return n.id === id; });
                if (s) s.html = body.innerHTML;
            }
        });
    }

    function debounceSaveStickies() {
        clearTimeout(_stickyTimer);
        _stickyTimer = setTimeout(function() {
            syncStickiesFromDOM();
            saveStickies();
        }, 600);
    }

    function renderStickies() {
        var grid = document.getElementById('stickyGrid');
        grid.innerHTML = '';
        if (_stickies.length === 0) {
            grid.innerHTML = '<div class="sticky-empty">Click + to add a note</div>';
            return;
        }
        _stickies.forEach(function(note) {
            var el = document.createElement('div');
            el.className = 'sticky-note';
            el.dataset.id = note.id;
            el.dataset.color = String(note.color);

            var del = document.createElement('button');
            del.className = 'sticky-delete';
            del.innerHTML = '&#215;';
            del.addEventListener('click', function() {
                _stickies = _stickies.filter(function(n) { return n.id !== note.id; });
                saveStickies();
                renderStickies();
            });

            var body = document.createElement('div');
            body.className = 'sticky-body';
            body.contentEditable = 'true';
            body.innerHTML = note.html || '';
            body.addEventListener('input', debounceSaveStickies);

            el.append(del, body);
            grid.appendChild(el);
        });
    }

    function showNotesStatus(msg, isErr) {
        var el = document.getElementById('notesStatus');
        if (!el) return;
        el.textContent = msg;
        el.className = 'notes-status' + (isErr ? ' error' : '');

    }

    // ===== Weather =====
    async function loadWeather() {
        var c = document.getElementById('weatherContent');
        var cached = getCacheSync(KEYS.weatherCache);
        if (cached) { renderWeather(c, cached.data); if (isFresh(cached)) return; }
        try {
            var res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=46.9481&longitude=7.4474&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Europe/Zurich');
            var data = await res.json();
            setCache(KEYS.weatherCache, data.current);
            renderWeather(c, data.current);
        } catch(e) { if (!cached) c.innerHTML = '<p class="weather-loading">Unable to load</p>'; }
    }

    function renderWeather(el, d) {
        el.innerHTML =
            '<div class="weather-row">' +
            '<span class="weather-icon">' + wIcon(d.weather_code) + '</span>' +
            '<span class="weather-temp">' + Math.round(d.temperature_2m) + '\u00b0</span>' +
            '<div class="weather-info">' +
            '<div class="weather-desc">' + wDesc(d.weather_code) + '</div>' +
            '<div class="weather-details">Feels ' + Math.round(d.apparent_temperature) + '\u00b0 &middot; ' + d.relative_humidity_2m + '% &middot; ' + Math.round(d.wind_speed_10m) + ' km/h</div>' +
            '</div></div>';
    }

    function wIcon(c) {
        if (c === 0) return '\u2600\ufe0f';
        if (c <= 3) return '\u26c5';
        if (c <= 48) return '\u2601\ufe0f';
        if (c <= 67) return '\ud83c\udf27\ufe0f';
        if (c <= 86) return '\ud83c\udf28\ufe0f';
        if (c <= 99) return '\u26c8\ufe0f';
        return '\ud83c\udf24\ufe0f';
    }

    function wDesc(c) {
        if (c === 0) return 'Clear sky';
        if (c <= 3) return 'Partly cloudy';
        if (c <= 48) return 'Foggy';
        if (c <= 57) return 'Drizzle';
        if (c <= 67) return 'Rain';
        if (c <= 77) return 'Snow';
        if (c <= 82) return 'Rain showers';
        if (c <= 86) return 'Snow showers';
        if (c <= 99) return 'Thunderstorm';
        return '';
    }

    // ===== News =====
    function stripHTML(h) { var d = document.createElement('div'); d.innerHTML = h; return d.textContent || ''; }

    function timeAgo(s) {
        var d = new Date(s);
        if (isNaN(d)) return '';
        var m = Math.floor((Date.now() - d.getTime()) / 60000);
        if (m < 60) return m + 'm';
        var h = Math.floor(m / 60);
        if (h < 24) return h + 'h';
        return Math.floor(h / 24) + 'd';
    }

    function renderItems(container, items, max) {
        var ul = document.createElement('ul');
        ul.className = 'news-list';
        items.slice(0, max).forEach(function(item) {
            var li = document.createElement('li');
            li.className = 'news-item';
            var a = document.createElement('a');
            a.className = 'news-title';
            a.href = item.link || '#';
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = item.title;
            li.appendChild(a);
            var desc = stripHTML(item.desc || '').trim();
            if (desc && desc !== item.title) {
                var p = document.createElement('div');
                p.className = 'news-desc';
                p.textContent = desc;
                li.appendChild(p);
            }
            var meta = document.createElement('div');
            meta.className = 'news-meta';
            if (item.source) {
                var tag = document.createElement('span');
                tag.className = 'news-source-tag';
                tag.textContent = item.source;
                meta.appendChild(tag);
            }
            if (item.pubDate) {
                var t = document.createElement('span');
                t.textContent = timeAgo(item.pubDate);
                meta.appendChild(t);
            }
            li.appendChild(meta);
            ul.appendChild(li);
        });
        container.appendChild(ul);
    }

    function jsonp(url) {
        return new Promise(function(resolve, reject) {
            var cb = '_jp_' + Math.random().toString(36).slice(2);
            var script = document.createElement('script');
            var cleanup = function() { if (script.parentNode) script.parentNode.removeChild(script); };
            var timer = setTimeout(function() { delete window[cb]; cleanup(); reject(); }, 12000);
            window[cb] = function(data) { clearTimeout(timer); delete window[cb]; cleanup(); resolve(data); };
            script.src = url + '&callback=' + cb;
            script.onerror = function() { clearTimeout(timer); delete window[cb]; cleanup(); reject(); };
            document.head.appendChild(script);
        });
    }

    async function fetchFeed(rssUrl) {
        try {
            var data = await jsonp('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl));
            if (data.status !== 'ok' || !data.items) return null;
            return data.items.map(function(i) {
                return { title: i.title||'', link: i.link||'#', pubDate: i.pubDate||'', desc: i.description||'', source: i.author||'' };
            });
        } catch(e) { return null; }
    }

    function initNewsTabs() {
        document.querySelectorAll('.news-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.news-tab').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                var t = tab.dataset.tab;
                document.getElementById('newsPanel').style.display = t === 'news' ? 'block' : 'none';
                document.getElementById('techPanel').style.display = t === 'tech' ? 'block' : 'none';
            });
        });
    }

    async function loadNews() {
        var mainEl = document.getElementById('newsContent');
        var regEl = document.getElementById('newsRegional');
        var cached = getCacheSync(KEYS.newsCache);
        if (cached && cached.data) { renderNewsSections(mainEl, regEl, cached.data); if (isFresh(cached)) return; }
        var r = await Promise.all([fetchFeed('https://www.nzz.ch/recent.rss'), fetchFeed('https://www.nzz.ch/zuerich.rss')]);
        var d = { main: r[0]||[], regional: r[1]||[] };
        if (r[0] || r[1]) setCache(KEYS.newsCache, d);
        renderNewsSections(mainEl, regEl, d);
    }

    function renderNewsSections(mainEl, regEl, data) {
        mainEl.innerHTML = '';
        if (data.main && data.main.length) {
            var l = document.createElement('div');
            l.className = 'news-section-label';
            l.textContent = 'Aktuell';
            mainEl.appendChild(l);
            renderItems(mainEl, data.main, 8);
        } else {
            mainEl.innerHTML = '<p class="news-loading">Unable to load news</p>';
        }
        regEl.innerHTML = '';
        if (data.regional && data.regional.length) {
            var l = document.createElement('div');
            l.className = 'news-section-label';
            l.textContent = 'Regional';
            regEl.appendChild(l);
            renderItems(regEl, data.regional, 5);
        }
    }

    async function loadTechNews() {
        var el = document.getElementById('techContent');
        var cached = getCacheSync(KEYS.techCache);
        if (cached && cached.data) { renderTechNews(el, cached.data); if (isFresh(cached)) return; }
        var feeds = [
            { url: 'https://techcrunch.com/feed/', name: 'TechCrunch' },
            { url: 'https://feeds.arstechnica.com/arstechnica/index', name: 'Ars Technica' }
        ];
        var results = await Promise.all(feeds.map(function(f) {
            return fetchFeed(f.url).then(function(items) {
                if (!items) return [];
                return items.map(function(item) { item.source = f.name; return item; });
            });
        }));
        var all = results.flat().sort(function(a,b) { return new Date(b.pubDate) - new Date(a.pubDate); });
        if (all.length) setCache(KEYS.techCache, all);
        renderTechNews(el, all);
    }

    function renderTechNews(el, items) {
        el.innerHTML = '';
        if (!items || !items.length) { el.innerHTML = '<p class="news-loading">Unable to load tech news</p>'; return; }
        renderItems(el, items, 12);
    }

})();
</script>
</body>
