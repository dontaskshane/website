<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>Shane Wetzel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦠</text></svg>">
<style>
  :root {
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
    --ink: #1d1d1f;
    --ink-dim: rgba(29, 29, 31, 0.6);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; min-height: 100vh;
    font-family: var(--sans);
    color: var(--ink);
    background: #EDEDED;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  /* Blurred photo backdrop — crossfades slowly for subtle life behind glass */
  .backdrop {
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #F5F5F7 0%, #E8E6E3 100%);
  }
  .backdrop img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(60px) saturate(120%) brightness(1.05);
    transform: scale(1.3);
    opacity: 0;
    transition: opacity 2.5s ease;
    will-change: opacity;
  }
  .backdrop img.on { opacity: 0.55; }
  /* Soft light overlay to keep glass readable */
  .backdrop::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.15) 60%, rgba(0,0,0,0.08) 100%);
    pointer-events: none;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 28px 36px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 10;
  }
  .name {
    font-family: var(--sans);
    font-size: 17px;
    font-weight: 400;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-decoration: none;
    opacity: 0.88;
    transition: opacity .2s ease;
  }
  .name:hover { opacity: 1; }

  main {
    position: relative; z-index: 5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 80px 24px;
  }

  .tile {
    position: relative;
    width: 220px; height: 260px;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.38);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.55);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.6) inset,
      0 20px 50px -12px rgba(0, 0, 0, 0.18),
      0 4px 12px rgba(0, 0, 0, 0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    text-decoration: none;
    color: var(--ink);
    transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s ease, background .3s ease;
    cursor: pointer;
  }
  .tile:hover {
    transform: translateY(-8px) scale(1.02);
    background: rgba(255, 255, 255, 0.52);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.7) inset,
      0 32px 70px -14px rgba(0, 0, 0, 0.25),
      0 6px 18px rgba(0, 0, 0, 0.08);
  }
  .tile:active { transform: translateY(-4px) scale(1.01); transition-duration: .2s; }

  .tile .emoji {
    font-family: var(--emoji);
    font-size: 88px;
    line-height: 1;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.15));
    user-select: none;
  }
  .tile .logo-wrap {
    width: 92px; height: 92px;
    display: grid; place-items: center;
  }
  .tile .logo-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.18));
  }
  .tile .logo-wrap img.spin-breathe {
    animation: spin 16s linear infinite, breathe 4s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 1; }
  }

  /* Entrance animation */
  @keyframes tileIn {
    from { opacity: 0; transform: translateY(24px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .tile { animation: tileIn .6s cubic-bezier(.2,.8,.2,1) both; }
  .tile:nth-child(1) { animation-delay: .05s; }
  .tile:nth-child(2) { animation-delay: .15s; }
  .tile:nth-child(3) { animation-delay: .25s; }
  .tile .label {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    opacity: 0.85;
  }

  footer {
    position: fixed; bottom: 18px; left: 0; right: 0;
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }
  .backdoor {
    pointer-events: auto;
    font-size: 11px;
    font-weight: 400;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
    user-select: none;
  }

  @media (max-width: 720px) {
    html, body { overflow-y: auto; }
    header { padding: 20px 22px; }
    main {
      flex-direction: column;
      gap: 18px;
      padding: 90px 22px 60px;
    }
    .tile { width: min(86vw, 320px); height: 200px; }
    .tile .emoji { font-size: 70px; }
    .tile .logo-wrap { width: 72px; height: 72px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile .logo-wrap img.spin-breathe { animation: none; }
    .tile { animation: none; }
    .backdrop img { transition: none; }
  }

  /* Button reset so <button class="tile"> matches <a class="tile"> */
  button.tile { font: inherit; color: inherit; border: 1px solid rgba(255,255,255,0.55); }

  /* --- About modal --- */
  .modal {
    position: fixed; inset: 0; z-index: 50;
    background: transparent;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 32px;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .modal.open { display: flex; opacity: 1; }

  .about-win {
    width: min(860px, 100%);
    max-height: 86vh;
    background: #1C1C1E;
    color: #F5F5F7;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      0 40px 120px rgba(0, 0, 0, 0.55),
      0 0 0 0.5px rgba(255, 255, 255, 0.06);
    overflow: hidden;
    display: flex; flex-direction: column;
    transform: scale(0.96) translateY(8px);
    opacity: 0;
    transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
  }
  .modal.open .about-win { transform: none; opacity: 1; }

  .about-bar {
    display: flex; align-items: center;
    padding: 12px 14px;
    background: #2A2A2C;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    position: relative;
    flex-shrink: 0;
  }
  .about-bar .lights { display: flex; gap: 8px; }
  .about-bar .lt {
    width: 12px; height: 12px; border-radius: 50%;
    border: none; padding: 0; cursor: pointer;
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.2);
  }
  .about-bar .lt.close { background: #FF5F57; }
  .about-bar .lt.min   { background: #FEBC2E; }
  .about-bar .lt.max   { background: #28C840; }
  .about-bar .title {
    position: absolute; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    font-size: 13px; font-weight: 500;
    color: rgba(255, 255, 255, 0.88);
    pointer-events: none;
  }
  .about-bar .title .doc { font-family: var(--emoji); font-size: 14px; }

  .about-body {
    overflow-y: auto;
    padding: 36px 48px 44px;
    font-size: 14px;
    line-height: 1.55;
    color: rgba(245, 245, 247, 0.86);
  }
  .about-row {
    display: grid;
    grid-template-columns: 180px 1fr 1fr;
    gap: 24px;
    padding: 28px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .about-row:first-child { padding-top: 0; }
  .about-row:last-child  { border-bottom: none; padding-bottom: 0; }
  .about-row.single { grid-template-columns: 180px 1fr; }
  .about-label {
    font-weight: 500;
    color: #F5F5F7;
    font-size: 14px;
  }
  .about-col p { margin-bottom: 14px; }
  .about-col p:last-child { margin-bottom: 0; }
  .about-col em { font-style: italic; color: rgba(245, 245, 247, 0.72); }
  .about-col a {
    color: rgba(245, 245, 247, 0.86);
    text-decoration: none;
    border-bottom: 1px solid rgba(245, 245, 247, 0.25);
    transition: border-color .15s ease;
  }
  .about-col a:hover { border-bottom-color: rgba(245, 245, 247, 0.8); }

  @media (max-width: 680px) {
    .modal { padding: 16px; }
    .about-body { padding: 24px 22px 28px; font-size: 13px; }
    .about-row { grid-template-columns: 1fr; gap: 8px; padding: 20px 0; }
    .about-row.single { grid-template-columns: 1fr; }
    .about-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(245,245,247,0.55); }
  }
</style>
</head>
<body>

  <div class="backdrop" aria-hidden="true">
    <img id="bdA" alt="">
    <img id="bdB" alt="">
  </div>

  <header>
    <a href="/" class="name">Shane Wetzel</a>
  </header>

  <main>
    <a href="work.html" class="tile" aria-label="Work">
      <span class="logo-wrap"><img src="images/finder_folder.png" alt=""></span>
      <span class="label">Work</span>
    </a>
    <a href="universe.html" class="tile" aria-label="Universe">
      <span class="logo-wrap"><img src="images/logo_sw.png" alt="" class="spin-breathe"></span>
      <span class="label">Universe</span>
    </a>
    <button type="button" class="tile" id="aboutTile" aria-label="About me" aria-haspopup="dialog">
      <span class="emoji">🕵️</span>
      <span class="label">About me</span>
    </button>
  </main>

  <footer>
    <span class="backdoor">© 2026 Shane Wetzel</span>
  </footer>

  <div class="modal" id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" aria-hidden="true">
    <div class="about-win">
      <div class="about-bar">
        <div class="lights">
          <button class="lt close" aria-label="Close" id="aboutClose"></button>
          <button class="lt min" aria-label="Close"></button>
          <button class="lt max" aria-label="Close"></button>
        </div>
        <div class="title" id="aboutTitle"><span class="doc">🕵️</span><span>About me</span></div>
      </div>
      <div class="about-body">
        <div class="about-row">
          <div class="about-label">Contact</div>
          <div class="about-col">
            <p>Bern, CH</p>
            <p><a href="mailto:hello@shanewetzel.xyz">hello@shanewetzel.xyz</a></p>
          </div>
          <div class="about-col">
            <p><a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a></p>
          </div>
        </div>
        <div class="about-row">
          <div class="about-label">About me</div>
          <div class="about-col" style="grid-column: span 2;">
            <p>Shane Wetzel is based in Bern, Switzerland.</p>
            <p>This site collects selected work, photographs, and a visual universe of ongoing references.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  const PHOTOS = [
    'images/digital/altstadt.JPG',
    'images/digital/american_psycho.JPG',
    'images/digital/bike.JPG',
    'images/digital/karussell.JPG',
    'images/digital/people.JPG',
    'images/digital/work.JPG',
    'images/analog/bali.jpg',
    'images/analog/beach.jpg',
    'images/analog/ducati.jpg',
    'images/analog/gurtenfestival.jpg',
    'images/analog/rome.jpg',
    'images/iPhone/audi.jpeg',
    'images/iPhone/bahnhof.jpeg',
    'images/iPhone/lombok.jpeg',
    'images/iPhone/sardinien.jpeg',
    'images/iPhone/vully.jpeg'
  ];
  const a = document.getElementById('bdA');
  const b = document.getElementById('bdB');
  const pool = PHOTOS.slice().sort(() => Math.random() - 0.5);
  let i = 0, active = a, next = b;

  function swap() {
    const src = pool[i % pool.length];
    const img = new Image();
    img.onload = () => {
      next.src = src;
      next.classList.add('on');
      active.classList.remove('on');
      [active, next] = [next, active];
      i++;
    };
    img.src = src;
  }
  swap();
  setInterval(swap, 9000);

  // About modal
  const modal = document.getElementById('aboutModal');
  const openBtn = document.getElementById('aboutTile');
  const closeBtn = document.getElementById('aboutClose');
  function openAbout(){ modal.classList.add('open'); modal.setAttribute('aria-hidden','false'); }
  function closeAbout(){ modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); }
  openBtn.addEventListener('click', openAbout);
  closeBtn.addEventListener('click', closeAbout);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeAbout(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('open')) closeAbout(); });
})();
</script>
</body>
</html>
