<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Shane Wetzel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    cursor: grab;
    touch-action: none;
    -webkit-font-smoothing: antialiased;
  }
  body.dragging { cursor: grabbing; }
  body.dragging * { cursor: grabbing !important; }

  #stage {
    position: fixed; inset: 0;
    overflow: hidden;
  }
  /* Looping video background */
  #bgvid {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
    z-index: 0;
    opacity: 0.55;
  }
  #world {
    position: absolute; left: 0; top: 0;
    width: 1px; height: 1px;
    transform-origin: 0 0;
    will-change: transform;
    z-index: 2;
  }
  .tile {
    position: absolute;
    background: #0a0a0a;
    box-shadow: 0 4px 24px -6px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
    cursor: pointer;
    transition: box-shadow .35s cubic-bezier(.2,.8,.2,1),
                transform .35s cubic-bezier(.2,.8,.2,1),
                opacity .5s ease;
    user-select: none;
    -webkit-user-drag: none;
    border-radius: 4px;
    overflow: hidden;
    transform-style: preserve-3d;
    contain: layout paint;
  }
  .tile:hover {
    box-shadow: 0 14px 48px -4px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.4);
    z-index: 3;
  }

  /* Zoom indicator pill */
  #zoomPill {
    position: fixed; bottom: 20px; right: 20px; z-index: 10;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: rgba(255, 255, 255, 0.82);
    font: 500 11px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    letter-spacing: 0.04em;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .35s ease, transform .35s ease;
    pointer-events: none;
    user-select: none;
  }
  #zoomPill.show {
    opacity: 0.85;
    transform: translateY(0);
  }
  .tile .skeleton {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #2a2a2a 25%, #1a1a1a 50%, #2a2a2a 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .tile img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
    opacity: 0;
    transition: opacity .3s ease;
    border-radius: 4px;
  }
  .tile img.loaded { opacity: 1; }

  /* Glass pill back button */
  .back {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px 8px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: rgba(255, 255, 255, 0.88);
    font: 500 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    letter-spacing: -0.01em;
    text-decoration: none;
    cursor: pointer;
    opacity: 0;
    transition: opacity .4s ease, background .2s ease, transform .2s ease;
    user-select: none;
  }
  body.idle .back { opacity: 0; }
  body:not(.idle) .back { opacity: 1; }
  .back:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-1px); }
  .back:active { transform: translateY(0); }
  .back svg { flex-shrink: 0; opacity: 0.9; }

  /* Lightbox */
  #lb {
    position: fixed; inset: 0; z-index: 20;
    background: #000;
    display: none; align-items: center; justify-content: center;
    cursor: zoom-out;
  }
  #lb.open { display: flex; }
  #lb img {
    max-width: 94vw; max-height: 94vh;
    display: block; user-select: none;
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.8);
  }
</style>
</head>
<body class="idle">

  <div id="stage">
    <video id="bgvid" autoplay muted loop playsinline></video>
    <div id="world"></div>
  </div>

  <a href="index.html" class="back" aria-label="Home">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 13L5 8L10 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Shane Wetzel</span>
  </a>

  <div id="zoomPill">100%</div>

  <div id="lb"><img id="lbimg" alt=""></div>

<script>
(function(){
  'use strict';

  const isMobile = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;

  const IMAGES = [
    'images/digital/altstadt.JPG','images/digital/american_psycho.JPG','images/digital/axt.JPG',
    'images/digital/bike.JPG','images/digital/close.JPG','images/digital/dyson.jpg',
    'images/digital/floor.jpeg','images/digital/gucci.jpg','images/digital/gun.JPG',
    'images/digital/karussell.JPG','images/digital/mask.JPG','images/digital/people.JPG',
    'images/digital/plants.JPG','images/digital/restaurant.JPG','images/digital/rims.JPG',
    'images/digital/rolex.JPG','images/digital/spiderweb.JPG','images/digital/usm.JPG',
    'images/digital/wein.JPG','images/digital/work.JPG',
    'images/analog/bali.jpg','images/analog/bar.jpg','images/analog/beach.jpg',
    'images/analog/breaking_bad.jpg','images/analog/dive.jpg','images/analog/ducati.jpg',
    'images/analog/fire.jpg','images/analog/fish.jpg','images/analog/forrest.JPG',
    'images/analog/gurtenfestival.jpg','images/analog/lamborghini.jpg','images/analog/loeb.jpg',
    'images/analog/music.jpg','images/analog/ocean.jpg','images/analog/police.jpg',
    'images/analog/radiohead.jpg','images/analog/rome.jpg','images/analog/wien.JPG',
    'images/iPhone/amboss.jpeg','images/iPhone/asics.jpeg','images/iPhone/audi.jpeg',
    'images/iPhone/bahnhof.jpeg','images/iPhone/bikes.jpeg','images/iPhone/bugatti.jpeg',
    'images/iPhone/bw.jpeg','images/iPhone/camper.jpeg','images/iPhone/dino.jpeg',
    'images/iPhone/freileitungsmast.jpeg','images/iPhone/laser.jpeg','images/iPhone/lombok.jpeg',
    'images/iPhone/lorraine.jpeg','images/iPhone/marley.JPG','images/iPhone/miguel.jpeg',
    'images/iPhone/mju.jpeg','images/iPhone/mond.jpeg','images/iPhone/muenster.jpeg',
    'images/iPhone/orange_mask.jpeg','images/iPhone/poerfu.jpeg','images/iPhone/polo.jpeg',
    'images/iPhone/sardinien.jpeg','images/iPhone/schlumpf.JPG','images/iPhone/schnitzel.jpeg',
    'images/iPhone/sunset.jpeg','images/iPhone/tmax.jpeg','images/iPhone/vapormax.jpeg',
    'images/iPhone/versace.jpeg','images/iPhone/vitra.jpeg','images/iPhone/vully.jpeg',
    'images/iPhone/wien.JPG','images/iPhone/yb.jpeg'
  ];

  const world = document.getElementById('world');
  const stage = document.getElementById('stage');

  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(271);

  const SPREAD_W = isMobile ? 3000 : 4200;
  const SPREAD_H = isMobile ? 2000 : 2800;
  const CENTER_X = SPREAD_W / 2;
  const CENTER_Y = SPREAD_H / 2;

  const placements = [];
  const MIN_SEP = 220;
  for (let i = 0; i < IMAGES.length; i++){
    let x = 0, y = 0, ok = false, attempts = 0;
    while (!ok && attempts < 120){
      attempts++;
      x = rnd() * SPREAD_W;
      y = rnd() * SPREAD_H;
      ok = true;
      for (const p of placements){
        if (Math.hypot(x - p.x, y - p.y) < MIN_SEP){ ok = false; break; }
      }
    }
    placements.push({ x, y, rot: (rnd() - 0.5) * 3, scale: 0.75 + rnd() * 0.5 });
  }

  const DISPLAY_BASE = isMobile ? 180 : 240;

  IMAGES.forEach((name, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    const p = placements[i];
    tile.style.left = p.x + 'px';
    tile.style.top  = p.y + 'px';
    const baseTransform = `translate(-50%, -50%) rotate(${p.rot}deg)`;
    tile.dataset.base = baseTransform;
    tile.style.transform = baseTransform;

    // Skeleton placeholder
    const skeleton = document.createElement('div');
    skeleton.className = 'skeleton';
    tile.appendChild(skeleton);

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = '';
    img.draggable = false;
    img.dataset.src = name; // Store src in data attribute
    img.onload = () => {
      const r = img.naturalWidth / img.naturalHeight;
      let w, h;
      const base = DISPLAY_BASE * p.scale;
      if (r >= 1){ w = base; h = base / r; }
      else       { h = base; w = base * r; }
      tile.style.width  = Math.round(w) + 'px';
      tile.style.height = Math.round(h) + 'px';
      img.classList.add('loaded');
      skeleton.style.display = 'none'; // Hide skeleton when loaded
    };
    tile.appendChild(img);

    tile.addEventListener('click', (e) => {
      if (justDragged) return;
      openLightbox(name);
      e.stopPropagation();
    });

    world.appendChild(tile);
  });

  // Intersection Observer for lazy loading
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const img = entry.target;
        if (img.dataset.src) {
          img.src = img.dataset.src;
          delete img.dataset.src;
          observer.unobserve(img);
        }
      }
    });
  }, { rootMargin: '200px' }); // Increased margin for smoother panning

  // Observe all images
  document.querySelectorAll('.tile img').forEach(img => observer.observe(img));

  // --- Pan / Zoom ---
  let tx = 0, ty = 0, tz = 1;
  const MIN_Z = 0.2, MAX_Z = 4;

  function centerView(){
    tx = window.innerWidth / 2  - CENTER_X * tz;
    ty = window.innerHeight / 2 - CENTER_Y * tz;
    apply();
  }

  function apply(){
    world.style.transform = `translate(${tx}px, ${ty}px) scale(${tz})`;
    if (typeof scheduleDepth === 'function') scheduleDepth();
  }

  window.addEventListener('resize', apply);

  // --- Zoom indicator pill ---
  const zoomPill = document.getElementById('zoomPill');
  let zoomPillT;
  function showZoomPill(){
    zoomPill.textContent = Math.round(tz * 100) + '%';
    zoomPill.classList.add('show');
    clearTimeout(zoomPillT);
    zoomPillT = setTimeout(() => zoomPill.classList.remove('show'), 1400);
  }

  // --- Inertia ---
  let vx = 0, vy = 0;           // velocity px/ms
  let lastMoveT = 0, lastMoveX = 0, lastMoveY = 0;
  let inertiaRAF = null;
  function stopInertia(){ if (inertiaRAF){ cancelAnimationFrame(inertiaRAF); inertiaRAF = null; } }
  function runInertia(){
    // 0.94 per 16.67ms — time-based so it feels identical at 60 Hz and 120 Hz
    const DECAY = 0.94;
    let lastT = performance.now();
    function tick(now){
      const dt = Math.min(now - lastT, 64); lastT = now;
      const f = Math.pow(DECAY, dt / 16.67);
      tx += vx * dt;
      ty += vy * dt;
      vx *= f; vy *= f;
      apply();
      if (Math.abs(vx) + Math.abs(vy) > 0.02) inertiaRAF = requestAnimationFrame(tick);
      else inertiaRAF = null;
    }
    inertiaRAF = requestAnimationFrame(tick);
  }

  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  let justDragged = false, dragDist = 0;
  stage.addEventListener('mousedown', (e) => {
    stopInertia();
    dragging = true; dragDist = 0;
    sx = e.clientX; sy = e.clientY;
    ox = tx; oy = ty;
    vx = vy = 0;
    lastMoveT = performance.now(); lastMoveX = e.clientX; lastMoveY = e.clientY;
    document.body.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    dragDist = Math.max(dragDist, Math.hypot(dx, dy));
    tx = ox + dx; ty = oy + dy;
    const now = performance.now();
    const dt = Math.max(1, now - lastMoveT);
    vx = (e.clientX - lastMoveX) / dt;
    vy = (e.clientY - lastMoveY) / dt;
    lastMoveT = now; lastMoveX = e.clientX; lastMoveY = e.clientY;
    apply();
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging');
    justDragged = dragDist > 4;
    setTimeout(() => justDragged = false, 80);
    if (Math.hypot(vx, vy) > 0.15) runInertia();
  });

  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    stopInertia();
    const f = e.deltaY < 0 ? 1.12 : 1/1.12;
    const newZ = Math.max(MIN_Z, Math.min(MAX_Z, tz * f));
    const mx = e.clientX, my = e.clientY;
    tx = mx - (mx - tx) * (newZ / tz);
    ty = my - (my - ty) * (newZ / tz);
    tz = newZ;
    apply();
    showZoomPill();
  }, { passive: false });

  let touches = {};
  stage.addEventListener('touchstart', (e) => {
    stopInertia();
    for (const t of e.changedTouches){
      touches[t.identifier] = { x: t.clientX, y: t.clientY };
    }
    if (Object.keys(touches).length === 1){
      const t = e.touches[0]; sx = t.clientX; sy = t.clientY; ox = tx; oy = ty;
      dragging = true; dragDist = 0;
      vx = vy = 0;
      lastMoveT = performance.now(); lastMoveX = t.clientX; lastMoveY = t.clientY;
    }
  }, { passive: false });

  stage.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const keys = Object.keys(touches);
    if (e.touches.length === 1 && keys.length === 1){
      const t = e.touches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      dragDist = Math.max(dragDist, Math.hypot(dx, dy));
      tx = ox + dx; ty = oy + dy;
      const now = performance.now();
      const dt = Math.max(1, now - lastMoveT);
      vx = (t.clientX - lastMoveX) / dt;
      vy = (t.clientY - lastMoveY) / dt;
      lastMoveT = now; lastMoveX = t.clientX; lastMoveY = t.clientY;
      apply();
    } else if (e.touches.length === 2){
      const [a, b] = [e.touches[0], e.touches[1]];
      const prevA = touches[a.identifier], prevB = touches[b.identifier];
      if (!prevA || !prevB) return;
      const prevDist = Math.hypot(prevA.x - prevB.x, prevA.y - prevB.y);
      const curDist  = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const f = curDist / Math.max(1, prevDist);
      const cx = (a.clientX + b.clientX) / 2, cy = (a.clientY + b.clientY) / 2;
      const newZ = Math.max(MIN_Z, Math.min(MAX_Z, tz * f));
      tx = cx - (cx - tx) * (newZ / tz);
      ty = cy - (cy - ty) * (newZ / tz);
      tz = newZ;
      apply();
      showZoomPill();
      touches[a.identifier] = { x: a.clientX, y: a.clientY };
      touches[b.identifier] = { x: b.clientX, y: b.clientY };
    }
  }, { passive: false });

  stage.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) delete touches[t.identifier];
    if (e.touches.length === 0){
      dragging = false;
      justDragged = dragDist > 6;
      setTimeout(() => justDragged = false, 100);
      if (Math.hypot(vx, vy) > 0.15) runInertia();
    }
  });

  // Load video only on desktop — .MOV is too heavy for mobile
  const bgvid = document.getElementById('bgvid');
  if (!isMobile) {
    bgvid.src = 'images/background_video.MOV';
    bgvid.addEventListener('canplay', () => { bgvid.playbackRate = 0.4; }, { once: true });
  } else {
    bgvid.remove();
  }

  // --- Tile tilt on hover — subtle 3° based on cursor position ---
  document.querySelectorAll('.tile').forEach(tile => {
    tile.addEventListener('pointerenter', (e) => {
      if (e.pointerType !== 'mouse') return;
      tile.style.transition = 'box-shadow .35s cubic-bezier(.2,.8,.2,1), opacity .5s ease';
    });
    tile.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const r = tile.getBoundingClientRect();
      const nx = ((e.clientX - r.left) / r.width) - 0.5;
      const ny = ((e.clientY - r.top) / r.height) - 0.5;
      const rx = (-ny * 6).toFixed(2);
      const ry = (nx * 6).toFixed(2);
      const base = tile.dataset.base || '';
      tile.style.transform = `${base} perspective(600px) rotateX(${rx}deg) rotateY(${ry}deg) scale(1.04)`;
    });
    tile.addEventListener('pointerleave', () => {
      tile.style.transition = '';
      tile.style.transform = tile.dataset.base || '';
    });
  });

  // Lightbox
  const lb = document.getElementById('lb');
  const lbimg = document.getElementById('lbimg');
  function openLightbox(src){
    lbimg.src = src;
    lb.classList.add('open');
  }
  function closeLightbox(){
    lb.classList.remove('open');
    lbimg.src = '';
  }
  lb.addEventListener('click', closeLightbox);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){
      if (lb.classList.contains('open')) closeLightbox();
      else window.location.href = 'index.html';
    }
  });

  // Back button: always visible on touch, fades after idle on desktop
  if (isMobile) {
    document.body.classList.remove('idle');
  } else {
    let idleT;
    function rouse(){
      document.body.classList.remove('idle');
      clearTimeout(idleT);
      idleT = setTimeout(() => document.body.classList.add('idle'), 2600);
    }
    window.addEventListener('mousemove', rouse);
    rouse();
  }

  centerView();

  // Preload images near the initial center for instant feedback
  const preloadDistance = 1000; // Distance from center to preload
  document.querySelectorAll('.tile img').forEach((img, i) => {
    const tile = img.parentElement;
    const rect = tile.getBoundingClientRect();
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;
    const dist = Math.hypot(rect.left + rect.width/2 - centerX, rect.top + rect.height/2 - centerY);
    if (dist < preloadDistance && img.dataset.src) {
      img.src = img.dataset.src;
      delete img.dataset.src;
      observer.unobserve(img);
    }
  });


  // --- Depth fade for far tiles — runs throttled via rAF, scheduled by apply() ---
  var tilesAll = Array.from(document.querySelectorAll('.tile'));
  var depthRAF = null;
  function updateDepth(){
    depthRAF = null;
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const maxD = Math.hypot(cx, cy) * 1.6;
    for (const tile of tilesAll){
      const rx = parseFloat(tile.style.left) || 0;
      const ry = parseFloat(tile.style.top) || 0;
      // World-space → screen-space using current tx/ty/tz
      const sxp = rx * tz + tx - cx;
      const syp = ry * tz + ty - cy;
      const d = Math.hypot(sxp, syp);
      const k = Math.min(1, d / maxD);
      tile.style.opacity = (1 - k * 0.45).toFixed(3);
    }
  }
  function scheduleDepth(){ if (!isMobile && !depthRAF) depthRAF = requestAnimationFrame(updateDepth); }
  window.addEventListener('resize', scheduleDepth);
  scheduleDepth();

  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
</html>
