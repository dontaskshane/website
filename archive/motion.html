<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Shane Wetzel — Motion</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎞️</text></svg>">
<style>
  :root {
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  #gl {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    cursor: crosshair;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 20px 22px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 5;
    pointer-events: none;
  }
  header > * { pointer-events: auto; }

  /* Glass pill — clean, minimal */
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: -0.01em;
    text-decoration: none;
    transition: background .25s ease, transform .25s ease;
  }
  .pill:hover { background: rgba(255, 255, 255, 0.18); transform: translateY(-1px); }
  .pill .arr { opacity: 0.7; }

  #loader {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #fff;
    font-family: var(--sans); font-size: 12px; font-weight: 400;
    letter-spacing: 0.12em;
    transition: opacity .6s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }

  @media (max-width: 640px) {
    header { padding: 14px 14px; }
    .pill { font-size: 11px; padding: 7px 12px; }
  }
</style>
</head>
<body>

  <canvas id="gl"></canvas>

  <header>
    <a href="index.html" class="pill" aria-label="Back home"><span class="arr">←</span><span>Shane Wetzel</span></a>
  </header>

  <div id="loader"><span id="pct">LOADING</span></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
  'use strict';

  const IMAGES = [
    'img_1.JPG','img_2.jpeg','img_3.jpeg','img_4.jpeg','img_5.jpeg',
    'img_6.jpeg','img_7.JPG','img_8.JPG','img_9.JPG','img_10.JPG',
    'img_11.jpeg','img_12.jpeg','img_13.jpg','img_14.jpg','img_15.jpg',
    'img_16.jpeg','img_17.jpeg','DSC04066.JPG','DSC04133.JPG',
    'IMG_0191.jpeg','IMG_0206.jpeg','IMG_1921.jpeg','IMG_2125.JPG',
    'IMG_2287.jpeg','IMG_2441.jpeg','IMG_2659.jpeg','IMG_2836.jpeg',
    'R0000188.JPG','R0000229.JPG','dedeAA018A.jpg'
  ];
  const FOLDER = 'images/';

  const canvas = document.getElementById('gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  const blackTex = new THREE.DataTexture(new Uint8Array([0,0,0,255]), 1, 1, THREE.RGBAFormat);
  blackTex.needsUpdate = true;

  const uniforms = {
    uTex0:     { value: blackTex },
    uTex1:     { value: blackTex },
    uTexSize0: { value: new THREE.Vector2(1,1) },
    uTexSize1: { value: new THREE.Vector2(1,1) },
    uRes:      { value: new THREE.Vector2(1,1) },
    uTime:     { value: 0 },
    uMix:      { value: 0 },
    uPixel:    { value: 3 },
    uHover:    { value: 0 }
  };

  const material = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: `
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
    `,
    fragmentShader: `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uTex0;
      uniform sampler2D uTex1;
      uniform vec2  uTexSize0;
      uniform vec2  uTexSize1;
      uniform vec2  uRes;
      uniform float uTime;
      uniform float uMix;
      uniform float uPixel;
      uniform float uHover;

      float rnd(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

      vec2 coverUv(vec2 uv, vec2 ts){
        float t = ts.x / max(ts.y, 1.0);
        float s = uRes.x / max(uRes.y, 1.0);
        vec2 sc = vec2(1.0);
        if (t > s) sc.x = s / t; else sc.y = t / s;
        return (uv - 0.5) / sc + 0.5;
      }

      vec3 sampleTex(sampler2D tex, vec2 uv, float ca){
        float r = texture2D(tex, uv + vec2(ca, 0.0)).r;
        float g = texture2D(tex, uv).g;
        float b = texture2D(tex, uv - vec2(ca, 0.0)).b;
        vec3 col = vec3(r, g, b);
        if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) col = vec3(0.0);
        return col;
      }

      void main(){
        vec2 px = vec2(uPixel) / uRes;
        vec2 uv = floor(vUv / px) * px + px * 0.5;

        float ca = 0.0022 + uHover * 0.003;

        vec2 cUv0 = coverUv(uv, uTexSize0);
        vec2 cUv1 = coverUv(uv, uTexSize1);

        vec3 c0 = sampleTex(uTex0, cUv0, ca);
        vec3 c1 = sampleTex(uTex1, cUv1, ca);

        float m = smoothstep(0.0, 1.0, uMix);
        vec3 col = mix(c0, c1, m);

        float n = rnd(uv + uTime * 0.27) * 0.06 - 0.03;
        col += n;

        col = pow(max(col, 0.0), vec3(0.96));

        float d = distance(vUv, vec2(0.5));
        col *= smoothstep(1.15, 0.35, d) * 0.94 + 0.06;

        gl_FragColor = vec4(col, 1.0);
      }
    `
  });

  const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
  scene.add(plane);

  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    uniforms.uRes.value.set(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  const loader = new THREE.TextureLoader();
  const textures = new Array(IMAGES.length);
  let loaded = 0;
  const pctEl = document.getElementById('pct');
  const loaderEl = document.getElementById('loader');

  function onOne(i, tex){
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
    tex.colorSpace = THREE.SRGBColorSpace || tex.colorSpace;
    textures[i] = tex;
    loaded++;
    pctEl.textContent = 'LOADING ' + Math.floor(loaded / IMAGES.length * 100) + '%';
    if (loaded === IMAGES.length) ready();
  }

  IMAGES.forEach((name, i) => {
    loader.load(FOLDER + name, t => onOne(i, t), undefined, () => onOne(i, blackTex));
  });

  let current = 0;
  let transitioning = false;

  function setCurrent(i){
    current = ((i % IMAGES.length) + IMAGES.length) % IMAGES.length;
    const t = textures[current];
    if (!t) return;
    uniforms.uTex0.value = t;
    uniforms.uTexSize0.value.set(t.image?.width || 1, t.image?.height || 1);
    uniforms.uMix.value = 0;
  }

  function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }

  function transition(dir){
    if (transitioning) return;
    transitioning = true;
    const next = ((current + dir) % IMAGES.length + IMAGES.length) % IMAGES.length;
    const nt = textures[next];
    if (!nt){ transitioning = false; return; }

    uniforms.uTex1.value = nt;
    uniforms.uTexSize1.value.set(nt.image?.width || 1, nt.image?.height || 1);
    uniforms.uMix.value = 0;

    const start = performance.now();
    const dur = 750;

    (function step(){
      const now = performance.now();
      const t = Math.min(1, (now - start) / dur);
      const e = easeInOutCubic(t);
      uniforms.uMix.value = e;
      const pulse = Math.sin(t * Math.PI);
      uniforms.uPixel.value = 3 + pulse * 20;

      if (t < 1) requestAnimationFrame(step);
      else {
        uniforms.uTex0.value = nt;
        uniforms.uTexSize0.value.set(nt.image?.width || 1, nt.image?.height || 1);
        uniforms.uMix.value = 0;
        uniforms.uPixel.value = 3;
        current = next;
        transitioning = false;
      }
    })();
  }

  function ready(){
    setCurrent(0);
    loaderEl.classList.add('done');
    setTimeout(() => loaderEl.remove(), 700);
    animate();
    setInterval(() => transition(1), 5600);
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowRight' || k === ' ') { e.preventDefault(); transition(1); }
    else if (k === 'ArrowLeft') { transition(-1); }
    else if (k === 'Escape') { window.location.href = 'index.html'; }
  });
  canvas.addEventListener('click', (e) => {
    if (e.target.closest('header')) return;
    transition(1);
  });

  let hoverTO = null;
  window.addEventListener('mousemove', () => {
    uniforms.uHover.value = 1;
    clearTimeout(hoverTO);
    hoverTO = setTimeout(() => uniforms.uHover.value = 0, 300);
  });

  const t0 = performance.now();
  function animate(){
    requestAnimationFrame(animate);
    uniforms.uTime.value = (performance.now() - t0) / 1000;
    renderer.render(scene, camera);
  }

  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
</html>
