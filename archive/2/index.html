<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>SW // 27</title>
<style>
  :root { --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", "Courier New", monospace; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#000; color:#fff;
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    -webkit-font-smoothing: antialiased;
  }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; cursor: crosshair; }
  .ui {
    position:fixed; z-index:5;
    mix-blend-mode: difference;
    color:#fff; user-select:none; pointer-events:none;
    line-height: 1.45;
  }
  .ui a, .ui button {
    pointer-events:auto; color:inherit; text-decoration:none;
    background:none; border:none; font:inherit; cursor:pointer;
    letter-spacing:inherit; text-transform:inherit;
  }
  .ui a:hover { opacity: .6; }
  .tl { top:16px; left:16px; }
  .tr { top:16px; right:16px; text-align:right; }
  .bl { bottom:16px; left:16px; }
  .br { bottom:16px; right:16px; text-align:right; }
  .ui .line { display:block; opacity:.9; }
  .ui .dim { opacity:.55; }
  .blink { animation: blink 1s steps(2,start) infinite; }
  @keyframes blink { to { opacity:0; } }

  /* Hidden backdoor hotspot: bottom-right corner, invisible */
  .hot {
    position:fixed; bottom:0; right:0;
    width:28px; height:28px; z-index:10;
    cursor:default;
  }

  /* Cursor follower dot (desktop only) */
  .cdot {
    position:fixed; width:8px; height:8px;
    border:1px solid #fff; mix-blend-mode:difference;
    pointer-events:none; z-index:6;
    transform: translate(-50%,-50%);
    transition: opacity .3s;
  }
  @media (hover: none) { .cdot { display:none; } }

  /* Loader */
  #loader {
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:flex-end; justify-content:flex-start;
    padding: 16px;
    background:#000; color:#fff;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    transition: opacity .6s ease;
  }
  #loader.done { opacity:0; pointer-events:none; }

  /* On mobile — compact */
  @media (max-width: 640px) {
    html, body { font-size: 10px; }
    .tl{top:12px;left:12px;} .tr{top:12px;right:12px;}
    .bl{bottom:12px;left:12px;} .br{bottom:12px;right:12px;}
  }
</style>
</head>
<body>

  <canvas id="gl"></canvas>
  <div class="cdot" id="cdot"></div>

  <div class="ui tl">
    <span class="line" id="clock">--:--:--</span>
    <span class="line dim">SW.XYZ / 26</span>
  </div>

  <div class="ui tr">
    <span class="line" id="idx">01/27</span>
    <span class="line dim" id="fname">——</span>
  </div>

  <div class="ui bl">
    <span class="line">BRN</span>
    <span class="line dim">46.948°N 7.447°E</span>
  </div>

  <div class="ui br">
    <a href="gallery.html" class="line">INDEX<span class="blink">_</span></a>
  </div>

  <div class="hot" id="hot" aria-hidden="true"></div>

  <div id="loader"><span id="pct">LOADING 0%</span></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
  'use strict';

  const IMAGES = [
    'img_1.JPG','img_2.jpeg','img_3.jpeg','img_4.jpeg','img_5.jpeg',
    'img_6.jpeg','img_7.JPG','img_8.JPG','img_9.JPG','img_10.JPG',
    'img_11.jpeg','img_12.jpg','img_13.jpg','img_14.jpg','img_15.jpg',
    'img_16.jpeg','img_17.jpeg','DSC04066.JPG','DSC04133.JPG',
    'IMG_0191.jpeg','IMG_0206.jpeg','IMG_1921.jpeg','IMG_2125.JPG',
    'IMG_2287.jpeg','IMG_2441.jpeg','IMG_2659.jpeg','IMG_2836.jpeg'
  ];
  const FOLDER = '../images/';

  // --- Three.js ---
  const canvas = document.getElementById('gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  // 1x1 black placeholder so uniform is always a valid texture
  const blackTex = new THREE.DataTexture(new Uint8Array([0,0,0,255]), 1, 1, THREE.RGBAFormat);
  blackTex.needsUpdate = true;

  const uniforms = {
    uTex:     { value: blackTex },
    uTexSize: { value: new THREE.Vector2(1,1) },
    uRes:     { value: new THREE.Vector2(1,1) },
    uTime:    { value: 0 },
    uGlitch:  { value: 0 },
    uPixel:   { value: 4 },
    uHover:   { value: 0 }
  };

  const material = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: `
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
    `,
    fragmentShader: `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uTex;
      uniform vec2  uTexSize;
      uniform vec2  uRes;
      uniform float uTime;
      uniform float uGlitch;
      uniform float uPixel;
      uniform float uHover;

      float rnd(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

      vec2 coverUv(vec2 uv){
        float t = uTexSize.x / max(uTexSize.y, 1.0);
        float s = uRes.x / max(uRes.y, 1.0);
        vec2 sc = vec2(1.0);
        if (t > s) sc.x = s / t; else sc.y = t / s;
        return (uv - 0.5) / sc + 0.5;
      }

      void main(){
        // Pixelate in screen space (square screen-pixels)
        vec2 px = vec2(uPixel) / uRes;
        vec2 uv = floor(vUv / px) * px + px * 0.5;
        vec2 cUv = coverUv(uv);

        // Horizontal glitch bands
        float bandY = floor(uv.y * 36.0) / 36.0;
        float tBand = floor(uTime * 5.0);
        float band  = step(0.9, rnd(vec2(bandY, tBand)));
        float shift = band * uGlitch * 0.14 * (rnd(vec2(bandY*2.0, tBand)) - 0.5);
        cUv.x += shift;

        // Chromatic aberration
        float ca = 0.0025 + uGlitch * 0.028 + uHover * 0.005;
        float r = texture2D(uTex, cUv + vec2(ca, 0.0)).r;
        float g = texture2D(uTex, cUv).g;
        float b = texture2D(uTex, cUv - vec2(ca, 0.0)).b;
        vec3 col = vec3(r, g, b);

        // Clamp if outside image (letterbox -> black)
        if (cUv.x < 0.0 || cUv.x > 1.0 || cUv.y < 0.0 || cUv.y > 1.0) col = vec3(0.0);

        // Slight saturation
        float luma = dot(col, vec3(0.299, 0.587, 0.114));
        col = mix(vec3(luma), col, 1.08);

        // Scanlines
        float scan = 0.88 + 0.12 * sin(vUv.y * uRes.y * 1.8);
        col *= scan;

        // Grain
        float n = rnd(uv + uTime * 0.37) * 0.11 - 0.055;
        col += n;

        // Rare block flash
        float flashMask = step(0.985, rnd(vec2(floor(uTime*8.0), floor(uv.y*8.0))));
        col = mix(col, vec3(rnd(uv + uTime)), flashMask * uGlitch * 0.6);

        // Vignette
        float d = distance(vUv, vec2(0.5));
        col *= smoothstep(1.1, 0.25, d) * 0.95 + 0.05;

        // Slight contrast
        col = pow(col, vec3(0.94));

        gl_FragColor = vec4(col, 1.0);
      }
    `
  });

  const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
  scene.add(plane);

  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    uniforms.uRes.value.set(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Preload textures ---
  const loader = new THREE.TextureLoader();
  const textures = new Array(IMAGES.length);
  let loaded = 0;
  const pctEl = document.getElementById('pct');
  const loaderEl = document.getElementById('loader');

  function onOne(i, tex){
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
    tex.colorSpace = THREE.SRGBColorSpace || tex.colorSpace;
    textures[i] = tex;
    loaded++;
    pctEl.textContent = 'LOADING ' + Math.floor(loaded / IMAGES.length * 100) + '%';
    if (loaded === IMAGES.length) ready();
  }

  IMAGES.forEach((name, i) => {
    loader.load(FOLDER + name, t => onOne(i, t), undefined, () => onOne(i, blackTex));
  });

  // --- Gallery control ---
  let current = 0;
  function setIndex(i){
    current = ((i % IMAGES.length) + IMAGES.length) % IMAGES.length;
    const t = textures[current];
    if (!t) return;
    uniforms.uTex.value = t;
    const img = t.image;
    uniforms.uTexSize.value.set(img?.width || 1, img?.height || 1);
    document.getElementById('idx').textContent =
      String(current + 1).padStart(2,'0') + '/' + String(IMAGES.length).padStart(2,'0');
    document.getElementById('fname').textContent = IMAGES[current].replace(/\.[^.]+$/, '');
  }

  // Transition: hard glitch cut — pixelation spike + glitch, swap texture mid-spike
  let glitchUntil = 0;
  let pixelTarget = 4;
  let pixelTween  = { from: 4, to: 4, start: 0, dur: 0 };

  function rampPixel(to, dur){
    pixelTween = { from: uniforms.uPixel.value, to: to, start: performance.now(), dur: dur };
    pixelTarget = to;
  }

  function transition(dir){
    const now = performance.now();
    glitchUntil = now + 420;
    rampPixel(64, 120);
    setTimeout(() => { setIndex(current + dir); rampPixel(90, 60); }, 170);
    setTimeout(() => { rampPixel(4, 280); }, 260);
  }

  function ready(){
    setIndex(0);
    loaderEl.classList.add('done');
    setTimeout(() => loaderEl.remove(), 700);
    animate();
    // Auto-advance
    setInterval(() => transition(1), 5400);
  }

  // --- Interaction ---
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowRight' || k === ' ') { e.preventDefault(); transition(1); }
    else if (k === 'ArrowLeft') { transition(-1); }
    else if (k.toLowerCase() === 'g') { window.location.href = 'gallery.html'; }
  });

  canvas.addEventListener('click', (e) => {
    if (e.target.closest('.ui') || e.target.closest('.hot')) return;
    transition(1);
  });

  // Cursor follower dot
  const cdot = document.getElementById('cdot');
  let hoverTO = null;
  window.addEventListener('mousemove', (e) => {
    cdot.style.left = e.clientX + 'px';
    cdot.style.top  = e.clientY + 'px';
    uniforms.uHover.value = 1;
    clearTimeout(hoverTO);
    hoverTO = setTimeout(() => uniforms.uHover.value = 0, 300);
  });

  // Clock
  const clockEl = document.getElementById('clock');
  function tick(){
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    clockEl.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    setTimeout(tick, 1000 - (d.getTime() % 1000));
  }
  tick();

  // --- Animate ---
  const t0 = performance.now();
  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    uniforms.uTime.value = (now - t0) / 1000;

    // Glitch decay
    const g = now < glitchUntil ? (glitchUntil - now) / 420 : 0;
    uniforms.uGlitch.value = Math.max(g, uniforms.uGlitch.value * 0.88);

    // Pixel tween
    const { from, to, start, dur } = pixelTween;
    if (dur > 0){
      const p = Math.min(1, (now - start) / dur);
      const eased = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2; // easeInOutQuad
      uniforms.uPixel.value = from + (to - from) * eased;
    }

    renderer.render(scene, camera);
  }

  // --- Dashboard backdoor: click hidden bottom-right hotspot 3x within 2s ---
  const hot = document.getElementById('hot');
  let clicks = 0, lastClick = 0;
  hot.addEventListener('click', () => {
    const n = Date.now();
    if (n - lastClick > 2000) clicks = 0;
    clicks++; lastClick = n;
    if (clicks >= 3) { clicks = 0; window.location.href = 'dashboard.html'; }
  });

  // Prevent pinch-zoom on iOS for cleaner look
  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
</html>
