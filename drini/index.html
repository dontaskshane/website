<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CutsByDrini — Weiterleitung</title>
  <style>
    :root {
      --bg: #0c0b0a;
      --text: #f5f0e8;
      --muted: #a8a29e;
      --accent: #c9a227;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
    }
    .box {
      max-width: 36rem;
      border: 1px solid rgba(245, 240, 232, 0.12);
      border-radius: 14px;
      padding: 1.5rem 1.75rem;
      background: #141210;
    }
    h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.75rem; }
    p { margin: 0 0 1rem; color: var(--muted); font-size: 0.9rem; }
    code, pre {
      font-family: var(--mono);
      font-size: 0.8rem;
      background: #1c1917;
      border-radius: 8px;
      padding: 0.2em 0.45em;
      color: var(--accent);
    }
    pre {
      display: block;
      padding: 12px 14px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0 0 1rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .spinner {
      width: 22px; height: 22px;
      border: 2px solid rgba(201, 162, 39, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box" id="root">
    <div class="spinner" id="loading" aria-hidden="true"></div>
    <h1 id="title">Weiterleitung…</h1>
    <p id="msg">CutsByDrini wird geladen.</p>
  </div>
  <script>
(function () {
  var root = document.getElementById("root");
  var loading = document.getElementById("loading");
  var titleEl = document.getElementById("title");
  var msgEl = document.getElementById("msg");

  function showSetup(message, detailHtml) {
    loading.style.display = "none";
    titleEl.textContent = "Noch ein Schritt";
    msgEl.innerHTML = message + (detailHtml || "");
  }

  function isPlaceholder(url) {
    if (!url) return true;
    var u = url.trim();
    if (!u) return true;
    if (/REPLACE_ME|your-deployment|example\.com/i.test(u)) return true;
    if (!/^https:\/\//i.test(u)) return true;
    return false;
  }

  fetch("./live.txt", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("live.txt fehlt");
      return r.text();
    })
    .then(function (text) {
      var line = text.split(/\r?\n/).map(function (l) { return l.trim(); }).find(function (l) {
        return l && l.indexOf("#") !== 0;
      });
      var url = line || "";

      if (isPlaceholder(url)) {
        showSetup(
          "<p>In dieser Datei muss deine echte Vercel-URL stehen (eine Zeile, mit <code>/drini</code> am Ende):</p>",
          "<pre>drini/live.txt</pre>" +
          "<p>Beispiel:</p>" +
          "<pre>https://dein-projekt.vercel.app/drini</pre>" +
          "<p>Dann diese Seite neu laden. Das Repo committen & pushen, damit GitHub Pages aktualisiert.</p>"
        );
        return;
      }

      titleEl.textContent = "Weiterleitung…";
      msgEl.textContent = "Du wirst weitergeleitet.";
      window.location.replace(url);
    })
    .catch(function () {
      showSetup(
        "<p><code>drini/live.txt</code> konnte nicht geladen werden. Lege die Datei an (sie liegt im Repo) mit genau einer Zeile:</p>",
        "<pre>https://DEIN-VERCEL-PROJEKT.vercel.app/drini</pre>"
      );
    });
})();
  </script>
</body>
</html>
