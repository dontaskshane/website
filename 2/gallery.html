<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>SW // INDEX</title>
<style>
  :root { --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", "Courier New", monospace; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#000; color:#fff;
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    -webkit-font-smoothing: antialiased;
    cursor: grab;
    touch-action: none;
  }
  body.dragging { cursor: grabbing; }
  body.dragging * { cursor: grabbing !important; }

  #stage {
    position: fixed; inset: 0;
    overflow: hidden;
  }
  #world {
    position: absolute; left:0; top:0;
    width: 1px; height: 1px; /* anchor — children positioned absolutely */
    transform-origin: 0 0;
    will-change: transform;
  }

  .tile {
    position: absolute;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #111;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.04);
    transition: filter .25s ease, box-shadow .2s ease, transform .25s ease;
    cursor: pointer;
  }
  .tile:hover {
    filter: none;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.8);
    z-index: 2;
  }
  .tile.loading { background: repeating-linear-gradient(45deg, #0a0a0a, #0a0a0a 6px, #111 6px, #111 12px); }

  .ui {
    position: fixed; z-index: 5;
    mix-blend-mode: difference; color: #fff;
    user-select: none; pointer-events: none;
    line-height: 1.45;
  }
  .ui a, .ui button {
    pointer-events: auto; color: inherit; text-decoration: none;
    background: none; border: none; font: inherit; cursor: pointer;
    letter-spacing: inherit; text-transform: inherit;
  }
  .ui a:hover { opacity: .6; }
  .tl { top:16px; left:16px; }
  .tr { top:16px; right:16px; text-align:right; }
  .bl { bottom:16px; left:16px; }
  .br { bottom:16px; right:16px; text-align:right; }
  .line { display: block; opacity: .9; }
  .dim { opacity: .55; }
  .blink { animation: blink 1s steps(2,start) infinite; }
  @keyframes blink { to { opacity: 0; } }

  /* Lightbox */
  #lb {
    position: fixed; inset: 0; z-index: 20;
    background: #000;
    display: none; align-items: center; justify-content: center;
    cursor: zoom-out;
  }
  #lb.open { display: flex; animation: glitchIn .45s ease; }
  #lb img {
    max-width: 92vw; max-height: 92vh;
    display: block; user-select: none;
    filter: contrast(1.02);
  }
  @keyframes glitchIn {
    0%   { opacity: 0; filter: hue-rotate(90deg) saturate(3); }
    30%  { opacity: 1; filter: hue-rotate(-60deg) saturate(2); transform: translateX(6px); }
    60%  { transform: translateX(-4px); filter: none; }
    100% { transform: none; opacity: 1; }
  }

  /* Hint fades after first interaction */
  #hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    z-index: 5; color: #fff; mix-blend-mode: difference;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    opacity: .7; pointer-events: none;
    transition: opacity .6s ease;
  }
  #hint.hidden { opacity: 0; }

  @media (max-width: 640px) {
    html, body { font-size: 10px; }
    .tl{top:12px;left:12px;} .tr{top:12px;right:12px;}
    .bl{bottom:12px;left:12px;} .br{bottom:12px;right:12px;}
  }
</style>
</head>
<body>

  <div id="stage">
    <div id="world"></div>
  </div>

  <div class="ui tl">
    <a href="index.html" class="line">← BACK</a>
  </div>
  <div class="ui tr">
    <span class="line" id="counter">27 OBJECTS</span>
    <span class="line dim" id="zoomlvl">ZOOM 1.0×</span>
  </div>
  <div class="ui bl">
    <span class="line dim">SW / INDEX</span>
  </div>
  <div class="ui br">
    <span class="line dim">DRAG · SCROLL · CLICK</span>
  </div>

  <div id="hint">DRAG TO PAN · SCROLL TO ZOOM</div>

  <div id="lb"><img id="lbimg" alt=""></div>

<script>
(function(){
  'use strict';

  const IMAGES = [
    'img_1.JPG','img_2.jpeg','img_3.jpeg','img_4.jpeg','img_5.jpeg',
    'img_6.jpeg','img_7.JPG','img_8.JPG','img_9.JPG','img_10.JPG',
    'img_11.jpeg','img_12.jpg','img_13.jpg','img_14.jpg','img_15.jpg',
    'img_16.jpeg','img_17.jpeg','DSC04066.JPG','DSC04133.JPG',
    'IMG_0191.jpeg','IMG_0206.jpeg','IMG_1921.jpeg','IMG_2125.JPG',
    'IMG_2287.jpeg','IMG_2441.jpeg','IMG_2659.jpeg','IMG_2836.jpeg'
  ];
  const FOLDER = '../images/';

  document.getElementById('counter').textContent = IMAGES.length + ' OBJECTS';

  const world = document.getElementById('world');
  const stage = document.getElementById('stage');

  // --- Deterministic scatter (Mulberry32 PRNG) ---
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(137);

  // Lay out images with a relaxed Poisson-ish sampling across a rectangle
  const SPREAD_W = 3600;
  const SPREAD_H = 2400;
  const CENTER_X = SPREAD_W / 2;
  const CENTER_Y = SPREAD_H / 2;

  const placements = [];
  const MIN_SEP = 180;
  for (let i = 0; i < IMAGES.length; i++){
    let x = 0, y = 0, ok = false, attempts = 0;
    while (!ok && attempts < 80){
      attempts++;
      x = rnd() * SPREAD_W;
      y = rnd() * SPREAD_H;
      ok = true;
      for (const p of placements){
        if (Math.hypot(x - p.x, y - p.y) < MIN_SEP){ ok = false; break; }
      }
    }
    placements.push({ x, y, rot: (rnd() - 0.5) * 4 }); // tiny random tilt
  }

  // --- Create tiles (as canvases — pixelated look) ---
  const TILE_MAX = 200;  // bitmap long side in px
  const DISPLAY_BASE = 200; // CSS display long side at zoom=1

  IMAGES.forEach((name, i) => {
    const tile = document.createElement('canvas');
    tile.className = 'tile loading';
    tile.dataset.index = i;
    tile.dataset.src = FOLDER + name;

    // temporary square while loading
    tile.width = 1; tile.height = 1;
    tile.style.width  = DISPLAY_BASE + 'px';
    tile.style.height = (DISPLAY_BASE * 0.75) + 'px';
    tile.style.left = placements[i].x + 'px';
    tile.style.top  = placements[i].y + 'px';
    tile.style.transform = `translate(-50%, -50%) rotate(${placements[i].rot}deg)`;
    world.appendChild(tile);

    const img = new Image();
    img.onload = () => {
      const r = img.naturalWidth / img.naturalHeight;
      let bw, bh, dw, dh;
      if (r >= 1){
        bw = TILE_MAX; bh = Math.round(TILE_MAX / r);
        dw = DISPLAY_BASE; dh = Math.round(DISPLAY_BASE / r);
      } else {
        bh = TILE_MAX; bw = Math.round(TILE_MAX * r);
        dh = DISPLAY_BASE; dw = Math.round(DISPLAY_BASE * r);
      }
      tile.width = bw; tile.height = bh;
      tile.style.width = dw + 'px';
      tile.style.height = dh + 'px';
      const ctx = tile.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, 0, 0, bw, bh);
      tile.classList.remove('loading');
    };
    img.onerror = () => { tile.style.background = '#200'; tile.classList.remove('loading'); };
    img.src = FOLDER + name;

    tile.addEventListener('click', (e) => {
      if (justDragged) return;
      openLightbox(FOLDER + name);
      e.stopPropagation();
    });
  });

  // --- Pan / Zoom ---
  let tx = 0, ty = 0, tz = 1;
  const MIN_Z = 0.25, MAX_Z = 5;

  // Start centered on the scatter
  function centerView(){
    tx = window.innerWidth / 2  - CENTER_X * tz;
    ty = window.innerHeight / 2 - CENTER_Y * tz;
    apply();
  }

  function apply(){
    world.style.transform = `translate(${tx}px, ${ty}px) scale(${tz})`;
    document.getElementById('zoomlvl').textContent = 'ZOOM ' + tz.toFixed(1) + '×';
  }

  window.addEventListener('resize', () => {
    apply();
  });

  // Mouse drag
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  let justDragged = false, dragDist = 0;
  stage.addEventListener('mousedown', (e) => {
    dragging = true; dragDist = 0;
    sx = e.clientX; sy = e.clientY;
    ox = tx; oy = ty;
    document.body.classList.add('dragging');
    hideHint();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    dragDist = Math.max(dragDist, Math.hypot(dx, dy));
    tx = ox + dx; ty = oy + dy;
    apply();
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging');
    justDragged = dragDist > 4;
    setTimeout(() => justDragged = false, 80);
  });

  // Wheel zoom around mouse
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.12 : 1/1.12;
    const newZ = Math.max(MIN_Z, Math.min(MAX_Z, tz * f));
    const mx = e.clientX, my = e.clientY;
    tx = mx - (mx - tx) * (newZ / tz);
    ty = my - (my - ty) * (newZ / tz);
    tz = newZ;
    apply();
    hideHint();
  }, { passive: false });

  // Touch: 1-finger pan, 2-finger pinch zoom
  let touches = {};
  stage.addEventListener('touchstart', (e) => {
    for (const t of e.changedTouches){
      touches[t.identifier] = { x: t.clientX, y: t.clientY };
    }
    if (Object.keys(touches).length === 1){
      const t = e.touches[0]; sx = t.clientX; sy = t.clientY; ox = tx; oy = ty;
      dragging = true; dragDist = 0;
    }
    hideHint();
  }, { passive: false });

  stage.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const keys = Object.keys(touches);
    if (e.touches.length === 1 && keys.length === 1){
      const t = e.touches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      dragDist = Math.max(dragDist, Math.hypot(dx, dy));
      tx = ox + dx; ty = oy + dy;
      apply();
    } else if (e.touches.length === 2){
      const [a, b] = [e.touches[0], e.touches[1]];
      const prevA = touches[a.identifier], prevB = touches[b.identifier];
      if (!prevA || !prevB) return;
      const prevDist = Math.hypot(prevA.x - prevB.x, prevA.y - prevB.y);
      const curDist  = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const f = curDist / Math.max(1, prevDist);
      const cx = (a.clientX + b.clientX) / 2, cy = (a.clientY + b.clientY) / 2;
      const newZ = Math.max(MIN_Z, Math.min(MAX_Z, tz * f));
      tx = cx - (cx - tx) * (newZ / tz);
      ty = cy - (cy - ty) * (newZ / tz);
      tz = newZ;
      apply();
      touches[a.identifier] = { x: a.clientX, y: a.clientY };
      touches[b.identifier] = { x: b.clientX, y: b.clientY };
    }
  }, { passive: false });

  stage.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) delete touches[t.identifier];
    if (e.touches.length === 0){
      dragging = false;
      justDragged = dragDist > 6;
      setTimeout(() => justDragged = false, 100);
    }
  });

  // Lightbox
  const lb = document.getElementById('lb');
  const lbimg = document.getElementById('lbimg');
  function openLightbox(src){
    lbimg.src = src;
    lb.classList.add('open');
  }
  function closeLightbox(){
    lb.classList.remove('open');
    lbimg.src = '';
  }
  lb.addEventListener('click', closeLightbox);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){
      if (lb.classList.contains('open')) closeLightbox();
      else window.location.href = 'index.html';
    }
  });

  // Hint
  let hintTimer = setTimeout(hideHint, 4000);
  function hideHint(){
    clearTimeout(hintTimer);
    document.getElementById('hint').classList.add('hidden');
  }

  centerView();

  // Prevent iOS gesture zoom
  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
</html>
