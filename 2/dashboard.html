<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>SW // DSH</title>
<style>
  :root {
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", "Courier New", monospace;
    --bg: #000;
    --fg: #fff;
    --dim: rgba(255,255,255,0.45);
    --dim2: rgba(255,255,255,0.18);
    --line: rgba(255,255,255,0.12);
    --accent: #fff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background: var(--bg); color: var(--fg);
    font-family: var(--mono);
    font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; }
  input, textarea, button {
    font: inherit; color: inherit;
    background: transparent; border: none; outline: none;
  }
  ::selection { background: #fff; color: #000; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============================
     LOGIN SCREEN
     ============================ */
  #login {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    padding: 24px;
  }
  #login.hidden { display: none; }
  .login-box { width: 100%; max-width: 420px; }
  .login-title {
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 20px;
  }
  .login-prompt {
    font-size: 14px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .login-caret::before { content: "▸"; color: var(--fg); }
  .login-input {
    width: 100%; padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    letter-spacing: 0.1em;
  }
  .login-input:focus { border-bottom-color: var(--fg); }
  .login-error {
    margin-top: 14px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #ff6b6b;
    min-height: 16px;
  }
  .login-hint {
    margin-top: 28px; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--dim);
  }

  /* ============================
     DASHBOARD
     ============================ */
  .app { display: none; }
  .app.ready { display: block; }

  .topbar {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 16px 24px; border-bottom: 1px solid var(--line);
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--dim);
  }
  .topbar a { text-decoration: none; color: var(--dim); }
  .topbar a:hover { color: var(--fg); }
  .topbar .tb-right { display: flex; gap: 20px; }

  /* Hero */
  .hero {
    padding: 48px 24px 56px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .hero-time {
    font-size: clamp(56px, 12vw, 140px);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.04em;
    line-height: 0.9;
  }
  .hero-meta {
    text-align: right;
    font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--dim);
  }
  .hero-meta .hero-date { color: var(--fg); font-size: 13px; margin-bottom: 4px; }
  .hero-meta .hero-greet { margin-top: 8px; }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-bottom: 1px solid var(--line);
  }
  .panel {
    padding: 24px;
    border-right: 1px solid var(--line);
    min-height: 320px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .panel:last-child { border-right: none; }
  .panel-label {
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--dim);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .panel-label .sub { font-size: 9px; color: var(--dim2); }

  /* Weather */
  .w-big { font-size: 72px; line-height: 0.95; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .w-big small { font-size: 22px; vertical-align: top; margin-left: 2px; color: var(--dim); }
  .w-desc { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
  .w-details {
    margin-top: auto;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--dim);
    padding-top: 12px; border-top: 1px solid var(--line);
  }
  .w-details span strong { color: var(--fg); font-weight: normal; }
  .w-loading { color: var(--dim); font-size: 11px; }

  /* Todos */
  .todo-form {
    display: flex; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .todo-form input {
    flex: 1; font-size: 13px;
  }
  .todo-form input::placeholder { color: var(--dim); }
  .todo-form button {
    cursor: pointer; color: var(--dim); font-size: 16px;
  }
  .todo-form button:hover { color: var(--fg); }
  .todo-list { list-style: none; flex: 1; overflow-y: auto; }
  .todo-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0; font-size: 13px;
    border-bottom: 1px dashed var(--dim2);
  }
  .todo-item:last-child { border-bottom: none; }
  .todo-check {
    width: 14px; height: 14px; border: 1px solid var(--fg); flex-shrink: 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 10px;
  }
  .todo-check.checked::after { content: "×"; }
  .todo-text { flex: 1; cursor: pointer; word-break: break-word; }
  .todo-item.done .todo-text { color: var(--dim); text-decoration: line-through; }
  .todo-del {
    color: var(--dim); cursor: pointer; opacity: 0; font-size: 12px;
    transition: opacity .15s;
  }
  .todo-item:hover .todo-del { opacity: 1; }
  .todo-del:hover { color: #ff6b6b; }
  .todo-empty {
    color: var(--dim); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    text-align: center; padding: 20px 0;
  }

  /* Notes */
  .notes-ta {
    flex: 1; resize: none; font-size: 13px; line-height: 1.6;
    padding: 0; min-height: 220px;
  }
  .notes-status {
    font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--dim); text-align: right; padding-top: 8px;
  }

  /* News section */
  .news-section { padding: 24px; }
  .news-header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim);
  }
  .news-tabs { display: flex; gap: 16px; }
  .news-tab { cursor: pointer; color: var(--dim); }
  .news-tab.active { color: var(--fg); border-bottom: 1px solid var(--fg); }
  .news-list { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }
  .news-item {
    padding: 12px 16px 12px 0; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 6px;
  }
  .news-item:nth-child(3n) { border-right: none; }
  .news-item a {
    font-size: 13px; line-height: 1.4; color: var(--fg); text-decoration: none;
  }
  .news-item a:hover { color: var(--dim); }
  .news-item .nm {
    font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dim2);
  }
  .news-loading { color: var(--dim); font-size: 11px; padding: 12px 0; }

  /* Footer */
  .foot {
    padding: 16px 24px; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--dim); display: flex; justify-content: space-between; align-items: center;
  }
  .foot a { color: var(--dim); text-decoration: none; }
  .foot a:hover { color: var(--fg); }

  /* Responsive */
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .panel { border-bottom: 1px solid var(--line); }
    .panel:nth-child(1) { border-right: 1px solid var(--line); }
    .panel:nth-child(2) { border-right: none; }
    .panel:nth-child(3) { grid-column: 1 / 3; border-right: none; }
    .news-list { grid-template-columns: 1fr; }
    .news-item { border-right: none; border-bottom: 1px solid var(--line); }
    .news-item:last-child { border-bottom: none; }
  }
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .panel { border-right: none; border-bottom: 1px solid var(--line); }
    .panel:nth-child(3) { grid-column: auto; }
    .hero { padding: 32px 20px; }
    .panel, .news-section, .topbar, .foot { padding: 20px; }
    .topbar { padding: 12px 20px; }
  }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login">
    <form class="login-box" id="loginForm" autocomplete="off">
      <div class="login-title">SW // DASHBOARD · AUTH</div>
      <div class="login-prompt"><span class="login-caret"></span><span>ENTER PASS</span></div>
      <input id="passInput" class="login-input" type="password" autocomplete="new-password" spellcheck="false" autofocus>
      <div class="login-error" id="loginError"></div>
      <div class="login-hint">ESC TO EXIT</div>
    </form>
  </div>

  <!-- APP -->
  <div class="app" id="app">

    <div class="topbar">
      <div>SW // DSH</div>
      <div class="tb-right">
        <span id="sessionTag">SESSION</span>
        <a href="#" id="logout">LOGOUT</a>
        <a href="index.html">EXIT</a>
      </div>
    </div>

    <div class="hero">
      <div class="hero-time" id="heroTime">--:--</div>
      <div class="hero-meta">
        <div class="hero-date" id="heroDate">——</div>
        <div>BRN · CH</div>
        <div class="hero-greet" id="heroGreet">——</div>
      </div>
    </div>

    <div class="grid">

      <!-- WEATHER -->
      <div class="panel" id="weatherPanel">
        <div class="panel-label"><span>WEATHER</span><span class="sub">BERN</span></div>
        <div id="weatherBody">
          <div class="w-loading">LOADING…</div>
        </div>
      </div>

      <!-- TODOS -->
      <div class="panel">
        <div class="panel-label"><span>TODO</span><span class="sub" id="todoCount">0</span></div>
        <form class="todo-form" id="todoForm">
          <input id="todoInput" type="text" placeholder="NEW TASK…" maxlength="200">
          <button type="submit" title="Add">+</button>
        </form>
        <ul class="todo-list" id="todoList"></ul>
      </div>

      <!-- NOTES -->
      <div class="panel">
        <div class="panel-label"><span>NOTES</span><span class="sub" id="notesStatus">—</span></div>
        <textarea class="notes-ta" id="notesArea" placeholder="…"></textarea>
      </div>

    </div>

    <!-- NEWS -->
    <div class="news-section">
      <div class="news-header">
        <div class="news-tabs">
          <span class="news-tab active" data-feed="recent">NZZ</span>
          <span class="news-tab" data-feed="zuerich">ZÜRICH</span>
        </div>
        <div class="sub" id="newsTime">——</div>
      </div>
      <div class="news-list" id="newsList">
        <div class="news-loading">LOADING FEED…</div>
      </div>
    </div>

    <div class="foot">
      <div>SHANEWETZEL.XYZ / DSH v2</div>
      <div id="footUptime">—</div>
    </div>

  </div>

<script>
(function(){
  'use strict';

  // ============================
  // CONSTANTS (matches legacy dashboard)
  // ============================
  const PASS_HASH = 'd88a1030fc943736069d7cb44a01a031a263cacb0ab7cfa7b28eb7d54653bb44';
  const KEYS = {
    session: 'dash_session',
    todos:   'dash_todos',
    notes:   'dash_notes'
  };
  const MAX_ATTEMPTS = 5;
  const LOCKOUT_MS = 60000;

  // ============================
  // AUTH
  // ============================
  async function sha256(str){
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function isAuthed(){
    try { return localStorage.getItem(KEYS.session) === 'true'; } catch(e){ return false; }
  }
  function setAuthed(v){
    try { v ? localStorage.setItem(KEYS.session,'true') : localStorage.removeItem(KEYS.session); } catch(e){}
  }

  function getLockout(){
    const t = parseInt(sessionStorage.getItem('dash_lockout') || '0', 10);
    return t > Date.now() ? t - Date.now() : 0;
  }
  function getAttempts(){ return parseInt(sessionStorage.getItem('dash_attempts') || '0', 10); }
  function bumpAttempts(){
    const a = getAttempts() + 1;
    sessionStorage.setItem('dash_attempts', String(a));
    if (a >= MAX_ATTEMPTS) sessionStorage.setItem('dash_lockout', String(Date.now() + LOCKOUT_MS));
    return a;
  }
  function clearAttempts(){
    sessionStorage.removeItem('dash_attempts');
    sessionStorage.removeItem('dash_lockout');
  }

  const loginEl     = document.getElementById('login');
  const loginForm   = document.getElementById('loginForm');
  const passInput   = document.getElementById('passInput');
  const loginError  = document.getElementById('loginError');
  const appEl       = document.getElementById('app');

  function showApp(){
    loginEl.classList.add('hidden');
    appEl.classList.add('ready');
    init();
  }

  function showLogin(){
    loginEl.classList.remove('hidden');
    appEl.classList.remove('ready');
    passInput.value = '';
    passInput.focus();
    const lock = getLockout();
    if (lock > 0){
      loginError.textContent = 'LOCKED · ' + Math.ceil(lock/1000) + 'S';
      passInput.disabled = true;
      const id = setInterval(() => {
        const l = getLockout();
        if (l <= 0){ clearInterval(id); passInput.disabled = false; loginError.textContent = ''; passInput.focus(); }
        else loginError.textContent = 'LOCKED · ' + Math.ceil(l/1000) + 'S';
      }, 500);
    }
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (getLockout() > 0) return;
    const val = passInput.value;
    if (!val) return;
    const hash = await sha256(val);
    if (hash === PASS_HASH){
      clearAttempts();
      setAuthed(true);
      showApp();
    } else {
      const a = bumpAttempts();
      loginError.textContent = 'DENIED · ' + (MAX_ATTEMPTS - a) + ' LEFT';
      passInput.value = '';
      if (a >= MAX_ATTEMPTS) showLogin();
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !loginEl.classList.contains('hidden')){
      window.location.href = 'index.html';
    }
  });

  document.getElementById('logout').addEventListener('click', (e) => {
    e.preventDefault();
    setAuthed(false);
    showLogin();
  });

  if (isAuthed()) showApp();
  else showLogin();

  // ============================
  // APP INIT (runs after login)
  // ============================
  let initialized = false;
  function init(){
    if (initialized) return;
    initialized = true;
    initClock();
    initTodos();
    initNotes();
    initWeather();
    initNews();
    initUptime();
  }

  // ============================
  // CLOCK / HERO
  // ============================
  function initClock(){
    const timeEl = document.getElementById('heroTime');
    const dateEl = document.getElementById('heroDate');
    const greetEl = document.getElementById('heroGreet');
    const pad = n => String(n).padStart(2,'0');
    const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const MO  = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

    function greet(h){
      if (h < 5)  return 'REST';
      if (h < 12) return 'GOOD MORNING';
      if (h < 17) return 'GOOD AFTERNOON';
      if (h < 22) return 'GOOD EVENING';
      return 'LATE';
    }

    function tick(){
      const d = new Date();
      timeEl.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
      dateEl.textContent = DOW[d.getDay()] + ' · ' + MO[d.getMonth()] + ' ' + pad(d.getDate()) + ' ' + d.getFullYear();
      greetEl.textContent = greet(d.getHours()) + ', S.';
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }
    tick();
  }

  // ============================
  // TODOS (localStorage)
  // ============================
  function loadTodos(){
    try { return JSON.parse(localStorage.getItem(KEYS.todos)) || []; } catch(e){ return []; }
  }
  function saveTodos(t){
    try { localStorage.setItem(KEYS.todos, JSON.stringify(t)); } catch(e){}
  }

  function initTodos(){
    const form   = document.getElementById('todoForm');
    const input  = document.getElementById('todoInput');
    const listEl = document.getElementById('todoList');
    const countEl= document.getElementById('todoCount');
    let todos = loadTodos();

    function render(){
      listEl.innerHTML = '';
      const pending = todos.filter(t => !t.done).length;
      countEl.textContent = pending + ' / ' + todos.length;
      if (todos.length === 0){
        const li = document.createElement('li');
        li.className = 'todo-empty';
        li.textContent = 'NO TASKS';
        listEl.appendChild(li);
        return;
      }
      // pending first, done below
      const sorted = [...todos].sort((a,b) => Number(a.done) - Number(b.done));
      for (const t of sorted){
        const li = document.createElement('li');
        li.className = 'todo-item' + (t.done ? ' done' : '');
        const chk = document.createElement('div');
        chk.className = 'todo-check' + (t.done ? ' checked' : '');
        chk.addEventListener('click', () => {
          t.done = !t.done;
          saveTodos(todos); render();
        });
        const txt = document.createElement('div');
        txt.className = 'todo-text';
        txt.textContent = t.text;
        txt.addEventListener('click', () => {
          t.done = !t.done;
          saveTodos(todos); render();
        });
        const del = document.createElement('span');
        del.className = 'todo-del';
        del.textContent = '×';
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          todos = todos.filter(x => x.id !== t.id);
          saveTodos(todos); render();
        });
        li.appendChild(chk); li.appendChild(txt); li.appendChild(del);
        listEl.appendChild(li);
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = input.value.trim();
      if (!v) return;
      todos.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2,7), text: v, done: false });
      input.value = '';
      saveTodos(todos); render();
    });

    render();
  }

  // ============================
  // NOTES (localStorage, debounced)
  // ============================
  function initNotes(){
    const ta = document.getElementById('notesArea');
    const statusEl = document.getElementById('notesStatus');
    try { ta.value = localStorage.getItem(KEYS.notes) || ''; } catch(e){}
    let timer = null;
    function setStatus(s){ statusEl.textContent = s; }
    setStatus(ta.value ? 'SAVED' : '—');
    ta.addEventListener('input', () => {
      setStatus('TYPING…');
      clearTimeout(timer);
      timer = setTimeout(() => {
        try { localStorage.setItem(KEYS.notes, ta.value); setStatus('SAVED'); }
        catch(e){ setStatus('ERROR'); }
      }, 500);
    });
    window.addEventListener('beforeunload', () => {
      try { localStorage.setItem(KEYS.notes, ta.value); } catch(e){}
    });
  }

  // ============================
  // WEATHER (Open-Meteo, Bern)
  // ============================
  const WEATHER_CODES = {
    0:'CLEAR',1:'MOSTLY CLEAR',2:'PARTLY CLOUDY',3:'OVERCAST',
    45:'FOG',48:'ICE FOG',51:'LIGHT DRIZZLE',53:'DRIZZLE',55:'HEAVY DRIZZLE',
    61:'LIGHT RAIN',63:'RAIN',65:'HEAVY RAIN',
    71:'LIGHT SNOW',73:'SNOW',75:'HEAVY SNOW',77:'SNOW GRAIN',
    80:'RAIN SHOWER',81:'HEAVY SHOWER',82:'VIOLENT SHOWER',
    85:'SNOW SHOWER',86:'HEAVY SNOW SHOWER',
    95:'THUNDER',96:'THUNDER + HAIL',99:'HEAVY THUNDER'
  };
  function initWeather(){
    const body = document.getElementById('weatherBody');
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=46.9481&longitude=7.4474'
              + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m'
              + '&daily=temperature_2m_max,temperature_2m_min&timezone=auto';
    fetch(url).then(r => r.json()).then(data => {
      const c = data.current;
      const d = data.daily;
      const temp = Math.round(c.temperature_2m);
      const feels = Math.round(c.apparent_temperature);
      const code = c.weather_code;
      const wind = Math.round(c.wind_speed_10m);
      const hum  = Math.round(c.relative_humidity_2m);
      const hi = Math.round(d.temperature_2m_max[0]);
      const lo = Math.round(d.temperature_2m_min[0]);
      body.innerHTML = `
        <div class="w-big">${temp}<small>°C</small></div>
        <div class="w-desc">${WEATHER_CODES[code] || 'UNKNOWN'}</div>
        <div class="w-details">
          <span>FEELS <strong>${feels}°</strong></span>
          <span>WIND <strong>${wind} KM/H</strong></span>
          <span>HUM <strong>${hum}%</strong></span>
          <span>H/L <strong>${hi}° / ${lo}°</strong></span>
        </div>`;
    }).catch(() => {
      body.innerHTML = '<div class="w-loading">WEATHER OFFLINE</div>';
    });
  }

  // ============================
  // NEWS (NZZ via JSONP → rss2json)
  // ============================
  function loadRss(url){
    return new Promise((resolve, reject) => {
      const cb = '__rss_' + Math.random().toString(36).slice(2,10);
      const s  = document.createElement('script');
      let done = false;
      const timeoutId = setTimeout(() => {
        if (done) return; done = true;
        try { delete window[cb]; } catch(e){} s.remove(); reject(new Error('timeout'));
      }, 10000);
      window[cb] = (data) => {
        if (done) return; done = true;
        clearTimeout(timeoutId);
        try { delete window[cb]; } catch(e){} s.remove();
        resolve(data);
      };
      s.onerror = () => {
        if (done) return; done = true;
        clearTimeout(timeoutId);
        try { delete window[cb]; } catch(e){} s.remove();
        reject(new Error('script error'));
      };
      s.src = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(url) + '&callback=' + cb + '&count=9';
      document.head.appendChild(s);
    });
  }

  function initNews(){
    const FEEDS = {
      recent:  'https://www.nzz.ch/recent.rss',
      zuerich: 'https://www.nzz.ch/zuerich.rss'
    };
    const listEl = document.getElementById('newsList');
    const timeEl = document.getElementById('newsTime');
    const tabs = document.querySelectorAll('.news-tab');

    function render(data, source){
      const items = (data && data.items) || [];
      if (items.length === 0){
        listEl.innerHTML = '<div class="news-loading">NO ITEMS</div>';
        return;
      }
      listEl.innerHTML = items.slice(0, 9).map(it => {
        const title = (it.title || '').replace(/</g,'&lt;');
        const link  = it.link || '#';
        const d = it.pubDate ? new Date(it.pubDate) : null;
        const ds = d ? d.toLocaleDateString('de-CH',{month:'short',day:'2-digit'}) + ' · ' + d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}) : '';
        return `<div class="news-item">
                  <a href="${link}" target="_blank" rel="noopener noreferrer">${title}</a>
                  <div class="nm">${source.toUpperCase()} · ${ds}</div>
                </div>`;
      }).join('');
      const now = new Date();
      timeEl.textContent = 'UPD ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }

    function load(key){
      listEl.innerHTML = '<div class="news-loading">LOADING…</div>';
      loadRss(FEEDS[key]).then(d => render(d, key)).catch(() => {
        listEl.innerHTML = '<div class="news-loading">FEED OFFLINE</div>';
      });
    }

    tabs.forEach(t => {
      t.addEventListener('click', () => {
        tabs.forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        load(t.dataset.feed);
      });
    });
    load('recent');
  }

  // ============================
  // UPTIME / FOOTER
  // ============================
  function initUptime(){
    const el = document.getElementById('footUptime');
    const start = Date.now();
    function pad(n){ return String(n).padStart(2,'0'); }
    function tick(){
      const s = Math.floor((Date.now() - start) / 1000);
      el.textContent = 'UP ' + pad(Math.floor(s/3600)) + ':' + pad(Math.floor((s%3600)/60)) + ':' + pad(s%60);
      setTimeout(tick, 1000);
    }
    tick();
  }

})();
</script>
